<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>캠브리지 영어 숙제</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#4361ee">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="영어숙제">
<style>
  :root {
    --primary: #5b6cff;
    --primary-2: #8b5cf6;
    --primary-dark: #4353e8;
    --bg: #f4f6ff;
    --card: #ffffff;
    --text: #232b54;
    --muted: #8a91b4;
    --danger: #ff5a5f;
    --success: #22c55e;
    --amber: #f59e0b;
    --gold: #b8860b;
    --radius: 20px;
    --shadow: 0 6px 18px rgba(80, 95, 200, .10);
    --shadow-sm: 0 3px 10px rgba(80, 95, 200, .08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    background:
      radial-gradient(900px 400px at 110% -10%, rgba(139, 92, 246, .10), transparent 60%),
      radial-gradient(800px 400px at -20% 0%, rgba(91, 108, 255, .10), transparent 55%),
      var(--bg);
    color: var(--text);
    display: flex; justify-content: center;
    padding-top: env(safe-area-inset-top);
  }
  #app { width: 100%; max-width: 430px; min-height: 100%; padding: 24px 20px; display: flex; flex-direction: column; }
  h1, .brand h1, .dash-name, .step-title, .ls-title, .rc-timer, .chip, .hw-status,
  .rc-main-btn, .logout-btn, .rc-result .title { font-family: 'Jua', 'Noto Sans KR', sans-serif; font-weight: 400; }

  /* ===== 로그인 ===== */
  .brand { text-align: center; margin: 30px 0 10px; }
  .brand h1 {
    font-size: 27px; letter-spacing: 1px;
    background: linear-gradient(120deg, var(--primary), var(--primary-2));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .brand h1::before { content: '🎧 '; -webkit-text-fill-color: initial; }
  .brand p { color: var(--muted); font-size: 14px; margin-top: 8px; }
  .build-stamp { font-size: 11px; opacity: 0.45; margin-top: 4px; }

  .step-title { font-size: 19px; margin: 26px 0 14px; }
  .back-btn { background: none; border: none; color: var(--muted); font-size: 14px; padding: 10px 0; cursor: pointer; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .choice-btn {
    background: var(--card); border: 2px solid transparent; border-radius: var(--radius);
    padding: 22px 12px; font-size: 18px; font-weight: 700; color: var(--text);
    box-shadow: var(--shadow-sm); cursor: pointer; transition: transform .08s, border-color .08s;
  }
  .choice-btn:active { transform: scale(.96); border-color: var(--primary); }

  /* PIN */
  .pin-dots { display: flex; justify-content: center; gap: 18px; margin: 24px 0 10px; }
  .pin-dot { width: 18px; height: 18px; border-radius: 50%; background: #dde1f5; transition: transform .12s, background .12s; }
  .pin-dot.filled { background: linear-gradient(135deg, var(--primary), var(--primary-2)); transform: scale(1.15); }
  .pin-msg { text-align: center; min-height: 20px; font-size: 14px; color: var(--danger); margin-bottom: 8px; font-weight: 700; }
  .pin-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 8px; }
  .pin-key {
    background: var(--card); border: none; border-radius: 18px;
    padding: 19px 0; font-size: 24px; font-weight: 700; color: var(--text);
    box-shadow: var(--shadow-sm); cursor: pointer; transition: transform .06s;
  }
  .pin-key:active { transform: scale(.94); background: #eef0ff; }
  .pin-key.fn { font-size: 14px; color: var(--muted); background: transparent; box-shadow: none; }

  .teacher-link { margin-top: auto; padding-top: 28px; text-align: center; }
  .teacher-link button { background: none; border: none; color: var(--muted); font-size: 13px; text-decoration: underline; cursor: pointer; }

  /* ===== 로그인 후(선생님 자리표시) ===== */
  .home-card { background: var(--card); border-radius: var(--radius); padding: 30px 20px; text-align: center; box-shadow: var(--shadow); margin-top: 32px; }
  .home-card .hello { font-size: 21px; font-weight: 700; margin-bottom: 8px; }
  .home-card .note { color: var(--muted); font-size: 13px; line-height: 1.6; }
  .logout-btn {
    margin-top: 20px; background: linear-gradient(120deg, var(--primary), var(--primary-2));
    color: #fff; border: none; border-radius: 999px; padding: 13px 28px; font-size: 16px; cursor: pointer;
    box-shadow: 0 6px 14px rgba(91, 108, 255, .35);
  }

  /* T-01 숙제 배부 */
  .tt-head { display: flex; align-items: center; justify-content: space-between; margin: 8px 0 18px; }
  .tt-title { font-family: 'Jua', 'Noto Sans KR', sans-serif; font-size: 22px; }
  .tt-logout { background: none; border: 1px solid var(--line, #e2e3ee); color: var(--muted); border-radius: 999px; padding: 7px 14px; font-size: 13px; cursor: pointer; }
  .asg-sec { background: var(--card); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); margin-bottom: 14px; }
  .asg-sec-t { font-weight: 700; font-size: 15px; margin-bottom: 12px; }
  .asg-seg { display: flex; gap: 8px; margin-bottom: 12px; }
  .asg-seg-btn { flex: 1; padding: 10px; border-radius: 12px; border: 1px solid var(--line, #e2e3ee); background: #fff; color: var(--muted); font-size: 14px; cursor: pointer; }
  .asg-seg-btn.on { background: linear-gradient(120deg, var(--primary), var(--primary-2)); color: #fff; border-color: transparent; font-weight: 700; }
  .asg-targets { display: flex; flex-direction: column; gap: 2px; }
  .asg-grp-head { font-size: 12px; color: var(--muted); margin: 10px 0 2px; font-weight: 700; }
  .asg-check { display: flex; align-items: center; gap: 10px; padding: 9px 6px; cursor: pointer; font-size: 15px; }
  .asg-check input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--primary); flex: none; }
  .asg-input { width: 100%; padding: 11px 12px; border-radius: 12px; border: 1px solid var(--line, #e2e3ee); font-size: 15px; font-family: inherit; background: #fff; box-sizing: border-box; }
  .asg-items { margin-top: 12px; display: flex; flex-direction: column; gap: 2px; }
  .asg-item { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .asg-item .asg-check { flex: 1; min-width: 55%; }
  .asg-count { width: 52px; padding: 7px; border-radius: 9px; border: 1px solid var(--line, #e2e3ee); font-size: 14px; text-align: center; }
  .asg-count-x { font-size: 12px; color: var(--muted); }
  .asg-row2 { display: flex; gap: 10px; }
  .asg-field { flex: 1; display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--muted); }
  .asg-summary { text-align: center; padding: 13px; border-radius: 12px; background: #f4f5ff; color: var(--muted); font-size: 14px; margin-bottom: 10px; }
  .asg-summary.ready { color: var(--text, #2b2d42); }
  .asg-summary b { color: var(--primary); }
  .asg-msg { text-align: center; font-size: 13px; color: var(--muted); min-height: 18px; margin-bottom: 8px; }
  .asg-hint { color: var(--muted); font-size: 13px; padding: 8px; }
  .asg-btn { width: 100%; padding: 15px; border: none; border-radius: 14px; background: linear-gradient(120deg, var(--primary), var(--primary-2)); color: #fff; font-size: 17px; font-family: 'Jua', 'Noto Sans KR', sans-serif; cursor: pointer; box-shadow: 0 6px 14px rgba(91, 108, 255, .35); }
  .asg-btn:disabled { opacity: .55; }

  /* --- 배부 v2 (Stage 3): 반 칩 · 요일 · 플랜 카드 · 페이지 가로 다이얼 --- */
  .asg-sub { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 4px; }
  .asg-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .asg-chip { padding: 11px 15px; border-radius: 13px; border: 1px solid var(--line, #e2e3ee); background: #fff; font-size: 15px; font-family: inherit; cursor: pointer; color: var(--muted); }
  .asg-chip.on { background: linear-gradient(120deg, var(--primary), var(--primary-2)); color: #fff; border-color: transparent; font-weight: 700; }
  .asg-chip small { display: block; font-size: 11px; opacity: .8; font-weight: 400; }
  .asg-days { display: flex; gap: 6px; margin-top: 12px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .asg-day { flex: none; width: 40px; padding: 8px 0; text-align: center; border-radius: 10px; border: 1px solid var(--line, #e2e3ee); background: #fff; font-size: 14px; font-family: inherit; color: var(--muted); cursor: pointer; }
  .asg-day.on { background: var(--primary); color: #fff; border-color: transparent; font-weight: 700; }
  .asg-day.today::after { content: '·'; display: block; line-height: 4px; font-size: 16px; }

  .asg-card { border: 1px solid var(--line, #e2e3ee); border-radius: 13px; padding: 12px; margin-bottom: 10px; }
  .asg-card.off { opacity: .45; }
  .asg-card-h { display: flex; align-items: center; gap: 9px; }
  .asg-card-h input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--primary); flex: none; }
  .asg-card-t { flex: 1; font-size: 15px; font-weight: 700; }
  .asg-card-tag { font-size: 11px; color: var(--muted); background: #f4f5ff; padding: 3px 8px; border-radius: 8px; }
  .asg-card-b { margin-top: 10px; }
  .asg-book { width: 100%; padding: 9px 10px; border-radius: 10px; border: 1px solid var(--line, #e2e3ee); font-size: 14px; font-family: inherit; background: #fff; box-sizing: border-box; margin-bottom: 9px; }
  .asg-bt { display: flex; gap: 6px; margin-bottom: 10px; }
  .asg-bt button { flex: 1; padding: 8px; border-radius: 10px; border: 1px solid var(--line, #e2e3ee); background: #fff; font-size: 13px; font-family: inherit; color: var(--muted); cursor: pointer; }
  .asg-bt button.on { background: var(--primary); color: #fff; border-color: transparent; font-weight: 700; }
  .asg-dial-l { font-size: 12px; color: var(--muted); margin-bottom: 4px; display: flex; justify-content: space-between; }
  .asg-dial-l b { color: var(--primary); font-size: 14px; }
  .asg-dial { display: flex; gap: 6px; overflow-x: auto; padding: 3px 0 8px; -webkit-overflow-scrolling: touch; scroll-snap-type: x proximity; }
  .asg-dial button { flex: none; width: 42px; height: 42px; border-radius: 11px; border: 1px solid var(--line, #e2e3ee); background: #fff; font-size: 15px; font-family: inherit; color: var(--muted); cursor: pointer; scroll-snap-align: center; }
  .asg-dial button.on { background: linear-gradient(120deg, var(--primary), var(--primary-2)); color: #fff; border-color: transparent; font-weight: 700; }
  .asg-dial button.between { background: #eceeff; color: var(--primary); }
  .asg-auto { font-size: 12px; color: var(--muted); margin-top: 7px; }
  .asg-auto b { color: var(--primary); }
  .asg-add { width: 100%; padding: 11px; border-radius: 12px; border: 1px dashed var(--line, #c9cbe0); background: #fff; color: var(--muted); font-size: 14px; font-family: inherit; cursor: pointer; }
  .asg-del { border: none; background: none; color: var(--muted); font-size: 18px; cursor: pointer; padding: 0 4px; }

  .loading { text-align: center; color: var(--muted); padding: 56px 0; }
  .loading::before { content: '⏳'; display: block; font-size: 30px; margin-bottom: 10px; animation: spin-soft 1.6s ease-in-out infinite; }
  @keyframes spin-soft { 50% { transform: rotate(180deg); } }
  .hidden { display: none; }

  /* ===== S-01 오늘의 숙제 ===== */
  .dash-head {
    display: flex; align-items: flex-start; justify-content: space-between;
    background: linear-gradient(125deg, var(--primary) 0%, var(--primary-2) 100%);
    border-radius: var(--radius); padding: 18px 18px 42px;
    color: #fff; box-shadow: 0 10px 24px rgba(91, 108, 255, .30);
  }
  .dash-date { font-size: 13px; opacity: .85; }
  .dash-name { font-size: 21px; margin-top: 3px; letter-spacing: .5px; }
  .dash-logout { background: rgba(255,255,255,.18); border: none; color: #fff; font-size: 12px;
    border-radius: 999px; padding: 6px 12px; cursor: pointer; }
  .chips { display: flex; gap: 10px; margin: -26px 6px 6px; position: relative; }
  .chip {
    background: var(--card); border-radius: 999px; padding: 9px 16px; font-size: 14px;
    box-shadow: var(--shadow-sm); letter-spacing: .5px;
  }
  .chip.point { color: var(--gold); }
  .chip.streak { color: #e05d38; }
  .tier-box { background: var(--card); border-radius: 16px; padding: 12px 16px; margin: 10px 0; box-shadow: var(--shadow-sm); }
  .tier-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 7px; }
  .tier-row b { color: var(--text); font-size: 13px; }
  .tier-bar { height: 10px; border-radius: 5px; background: #e6e9fa; overflow: hidden; }
  .tier-bar > div {
    height: 100%; border-radius: 5px; transition: width .5s ease;
    background: linear-gradient(90deg, var(--primary), var(--primary-2), #c084fc);
    background-size: 200% 100%; animation: shine 2.5s linear infinite;
  }
  @keyframes shine { to { background-position: 200% 0; } }
  .awards {
    background: linear-gradient(120deg, #fff8e1, #fff3d6); border: 1.5px solid #f5dfa0;
    border-radius: 16px; padding: 12px 16px; margin: 8px 0; box-shadow: var(--shadow-sm);
  }
  .awards .aw-title { font-size: 12px; color: #9a7b00; font-weight: 700; margin-bottom: 5px; }
  .awards .aw-title::before { content: '✨ '; }
  .awards .aw-row { display: flex; justify-content: space-between; font-size: 14px; padding: 3px 0; }
  .awards .aw-row b { color: var(--gold); font-family: 'Jua', sans-serif; }
  .today-progress { margin: 16px 0 8px; }
  .today-progress .tp-label { display: flex; justify-content: space-between; align-items: baseline; font-size: 15px; margin-bottom: 7px; }
  .today-progress .tp-label b { font-family: 'Jua', sans-serif; font-size: 17px; font-weight: 400; }
  .today-progress .tp-label span { font-size: 13px; color: var(--muted); }
  .tp-bar { height: 12px; border-radius: 6px; background: #e6e9fa; overflow: hidden; }
  .tp-bar > div { height: 100%; background: linear-gradient(90deg, #34d399, #22c55e); border-radius: 6px; transition: width .5s ease; }
  .cards { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; padding-bottom: 28px; }
  .hw-card {
    background: var(--card); border-radius: 18px; padding: 15px 14px; display: flex; align-items: center; gap: 12px;
    box-shadow: var(--shadow-sm); border-left: 6px solid transparent; cursor: pointer;
    transition: transform .08s;
  }
  .hw-card:active { transform: scale(.98); }
  .hw-card.st-redo { border-left-color: var(--danger); background: linear-gradient(90deg, #fff5f5, var(--card) 45%); }
  .hw-card.st-todo { border-left-color: var(--primary); }
  .hw-card.st-doing { border-left-color: var(--amber); }
  .hw-card.st-done { border-left-color: var(--success); opacity: .58; }
  .hw-icon {
    font-size: 22px; width: 44px; height: 44px; border-radius: 14px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; background: #eef0ff;
  }
  .st-redo .hw-icon { background: #ffecec; }
  .st-doing .hw-icon { background: #fef3e0; }
  .st-done .hw-icon { background: #e6f9ef; }
  .hw-main { flex: 1; min-width: 0; }
  .hw-subject { font-size: 11px; font-weight: 700; color: var(--primary); letter-spacing: .3px; }
  .hw-label { font-size: 16px; font-weight: 700; margin: 2px 0; }
  .hw-meta { font-size: 12px; color: var(--muted); }
  .hw-meta .overdue { color: var(--danger); font-weight: 700; }
  .hw-status { font-size: 13px; flex-shrink: 0; letter-spacing: .5px; }
  .st-redo .hw-status { color: var(--danger); }
  .st-todo .hw-status { color: var(--primary); }
  .st-doing .hw-status { color: var(--amber); }
  .st-done .hw-status { color: #189a58; }
  .empty-note { text-align: center; color: var(--muted); font-size: 15px; padding: 44px 0; line-height: 1.8; white-space: pre-line; }

  /* ===== S-02 듣기 학습 ===== */
  .ls-head { margin-bottom: 8px; }
  .ls-subject { font-size: 12px; font-weight: 700; color: var(--primary); }
  .ls-title { font-size: 21px; margin-top: 2px; }
  .ls-count { font-size: 13px; color: var(--muted); margin-top: 5px; }
  .ls-count b { color: var(--primary); font-family: 'Jua', sans-serif; font-size: 15px; }
  .ls-transcript {
    background: var(--card); border-radius: var(--radius); padding: 18px; margin: 12px 0;
    font-size: 15px; line-height: 2.0; max-height: 40vh; overflow-y: auto;
    box-shadow: var(--shadow-sm); white-space: pre-wrap;
  }
  .ls-transcript.empty { color: var(--muted); text-align: center; font-size: 14px; }
  .ls-progress { margin: 14px 0 4px; }
  .ls-bar { height: 12px; border-radius: 6px; background: #e6e9fa; overflow: hidden; }
  .ls-bar > div { height: 100%; background: linear-gradient(90deg, var(--primary), var(--primary-2)); border-radius: 6px; }
  .ls-time { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 5px; }
  .ls-controls { display: flex; justify-content: center; align-items: center; gap: 18px; margin: 18px 0; }
  .ls-btn {
    border: none; border-radius: 50%; width: 62px; height: 62px; font-size: 24px;
    background: var(--card); color: var(--text); box-shadow: var(--shadow-sm); cursor: pointer;
    transition: transform .08s;
  }
  .ls-btn.main {
    width: 84px; height: 84px; font-size: 32px; color: #fff;
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
    box-shadow: 0 10px 22px rgba(91, 108, 255, .40);
  }
  .ls-btn:active { transform: scale(.93); }
  .ls-btn:disabled { opacity: .4; }
  .ls-msg { text-align: center; min-height: 22px; font-size: 15px; font-weight: 700; }
  .ls-msg.good { color: #189a58; }
  .ls-msg.bad { color: var(--danger); }
  .ls-note { text-align: center; font-size: 11px; color: var(--muted); margin-top: 8px; }

  /* ===== S-03 녹음·제출 ===== */
  .rc-stage { background: var(--card); border-radius: var(--radius); padding: 28px 16px; margin: 14px 0;
    text-align: center; box-shadow: var(--shadow); }
  .rc-timer { font-size: 42px; letter-spacing: 3px; margin: 10px 0; color: var(--text); }
  .rc-state-label { font-size: 14px; color: var(--muted); min-height: 20px; }
  .rc-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--danger);
    margin-right: 6px; animation: rc-blink 1s infinite; vertical-align: 1px; }
  @keyframes rc-blink { 50% { opacity: .2; } }
  .rc-main-btn {
    border: none; border-radius: 999px; padding: 17px 38px; font-size: 18px; letter-spacing: .5px;
    color: #fff; cursor: pointer; margin-top: 14px; transition: transform .08s;
    background: linear-gradient(120deg, #ff6b6f, #ff8e53); box-shadow: 0 8px 18px rgba(255, 90, 95, .35);
  }
  .rc-main-btn.stop { background: linear-gradient(120deg, #3b4368, #232b54); box-shadow: 0 8px 18px rgba(35, 43, 84, .30); }
  .rc-main-btn.submit { background: linear-gradient(120deg, var(--primary), var(--primary-2)); box-shadow: 0 8px 18px rgba(91, 108, 255, .35); }
  .rc-main-btn:disabled { opacity: .5; }
  .rc-main-btn:active { transform: scale(.96); }
  .rc-sub-btn { border: none; background: none; color: var(--muted); font-size: 14px;
    text-decoration: underline; cursor: pointer; margin-top: 16px; }
  .rc-preview { width: 100%; margin-top: 14px; }
  .rc-result { text-align: center; }
  .rc-result .big { font-size: 48px; display: inline-block; animation: pop-in .5s cubic-bezier(.2, 1.6, .4, 1); }
  @keyframes pop-in { 0% { transform: scale(0); } 100% { transform: scale(1); } }
  .rc-result .title { font-size: 22px; margin: 8px 0 4px; }
  .rc-result .sub { font-size: 13px; color: var(--muted); }
  .rc-awards { margin: 14px auto 0; max-width: 300px; text-align: left; }

  /* ===== 거울 모드 (설계결정문서 5.4) — 저장 안 하는 카메라 프리뷰, 하루 최초 1회 ===== */
  .mirror-preview {
    position: fixed; bottom: 16px; right: 16px; width: 92px; height: 122px;
    border-radius: 16px; overflow: hidden; z-index: 40;
    box-shadow: 0 6px 18px rgba(27,35,64,.28); border: 2.5px solid #fff; background: #000;
  }
  .mirror-preview video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); display: block; }
  .mirror-badge {
    position: absolute; top: 4px; left: 4px; font-size: 9px; color: #fff;
    background: rgba(0,0,0,.5); border-radius: 6px; padding: 1px 5px; z-index: 1;
  }
  .mirror-caption {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 1;

<script src="recorder.js"></script>
<script>
// ===== 설정 =====
// GAS 웹앱(Api.gs) 배포 URL. 재배포 시 "기존 배포 수정 → 새 버전"을 쓰면 이 URL은 바뀌지 않는다.
var API_URL = 'https://script.google.com/macros/s/AKfycbw7YF-4dqomyexzQFUM3HiVLwZWUhNBBNcu2O-DqS1HXvpnTZ1mG2FglILSIoDGDmpY1g/exec';

// ===== 서버 호출 래퍼 =====
// file:// 로 직접 열면(개발 미리보기) mock, 그 외에는 GAS JSON API를 fetch로 호출
var Server = (function () {
  var useMock = location.protocol === 'file:' || /[?&]mock=1/.test(location.search);

  /**
   * 액션별 인자 이름(순서대로). Server.call('fn', [a, b])의 a·b가 여기 이름으로 매핑돼
   * GAS Api.gs의 req.{이름}이 된다.
   *
   * ⚠ 호출부에 인자를 추가하면 여기도 반드시 추가할 것. 예전에는 액션마다 손으로 쓴
   * 매퍼가 따로 있어서, 화면은 groupId를 넘기는데 매퍼가 token만 보내 서버가 빈 응답을
   * 주는 사고가 있었다(배부 v2). 이제 선언이 한 곳뿐이고, 아래 검사가 누락을 잡는다.
   */
  var ARG_NAMES = {
    getLoginBootstrap: [],
    loginStudent: ['studentId', 'pin'],
    loginTeacher: ['pin'],
    verifySession: ['token'],
    getTodayDashboard: ['token'],
    getListenData: ['token', 'itemId'],
    getAudioForUnit: ['token', 'contentUnitId'],
    recordListenSession: ['token', 'itemId', 'startedAt', 'completed', 'skipped'],
    submitRecording: ['token', 'itemId', 'base64', 'mimeType'],
    getAssignBootstrap: ['token', 'groupId', 'weekday'],
    createAssignments: ['token', 'payload']
  };

  function bodyOf(fn, args) {
    var names = ARG_NAMES[fn];
    if (!names) throw new Error('Server.call: 알 수 없는 액션 ' + fn + ' — ARG_NAMES에 추가하세요');
    args = args || [];
    // 넘긴 인자보다 이름이 적으면 조용히 버려진다 → 눈에 띄게 알린다
    if (args.length > names.length) {
      console.error('[Server] ' + fn + ': 인자 ' + args.length + '개를 넘겼는데 이름은 ' +
        names.length + '개뿐이라 뒤쪽이 서버로 안 갑니다. ARG_NAMES를 확인하세요.');
    }
    var body = { action: fn };
    names.forEach(function (n, i) { body[n] = args[i]; });
    return body;
  }

  if (!useMock) {
    return {
      call: function (fn, args, onOk, onErr) {
        var body = bodyOf(fn, args);
        fetch(API_URL, {
          method: 'POST',
          // text/plain: CORS preflight를 만들지 않는 안전한 타입 (설계결정문서 5.13)
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(body)
        })
          .then(function (r) { return r.json(); })
          .then(onOk)
          .catch(onErr || function () {
            alert('연결에 문제가 있어요. 인터넷을 확인하고 다시 해보세요.');
          });
      }
    };
  }
  // ---- 로컬 미리보기용 mock ----
  var MOCK = {
    getLoginBootstrap: function () {
      return { ok: true,
        groups: [ { group_id: 'G-A', group_name: 'A반' }, { group_id: 'G-B', group_name: 'B반' } ],
        studentsByGroup: {
          'G-A': [ { student_id: 'S001', name: '김철수' }, { student_id: 'S002', name: '이영희' } ],
          'G-B': [ { student_id: 'S003', name: '박민수' } ]
        } };
    },
    loginStudent: function (studentId, pin) {
      if (pin === '1234') return { ok: true, token: 'mock-token', role: 'student',
        student: { student_id: studentId, name: '김철수', group_id: 'G-A' } };
      return { ok: false, message: 'PIN이 맞지 않아요. (4번 남음)' };
    },
    loginTeacher: function (pin) {
      if (pin === '9999') return { ok: true, token: 'mock-teacher', role: 'teacher' };
      return { ok: false, message: '관리자 PIN이 맞지 않습니다.' };
    },
    verifySession: function (token) {
      if (token === 'mock-token') return { ok: true, role: 'student', studentId: 'S001' };
      if (token === 'mock-teacher') return { ok: true, role: 'teacher' };
      return { ok: false };
    },
    getTodayDashboard: function () {
      return { ok: true, today: '2026-07-18',
        cards: [
          { item_id: 'AI-1', subject: '기사', label: 'Article 2 · 본문 녹음', seq: '', action_type: 'record', status: '재제출요청', due_date: '2026-07-17', due_time: '21:00', overdue: true },
          { item_id: 'AI-2', subject: '기사', label: 'Article 3 · 단어 듣기', seq: '', action_type: 'listen', status: '미시작', due_date: '2026-07-18', due_time: '21:00', overdue: false },
          { item_id: 'AI-3', subject: 'Voca', label: 'Voca 07 암송', seq: '1/3', action_type: 'record', status: '진행중', due_date: '2026-07-18', due_time: '21:00', overdue: false },
          { item_id: 'AI-4', subject: 'QnA', label: 'Q&A 서술형 답안', seq: '', action_type: 'write', status: '미시작', due_date: '2026-07-18', due_time: '21:00', overdue: false },
          { item_id: 'AI-5', subject: '리스닝', label: 'Unit 2 · p.14 듣기', seq: '', action_type: 'listen', status: '제출완료', due_date: '2026-07-18', due_time: '21:00', overdue: false }
        ],
        progress: { done: 1, total: 5 },
        points: { total: 275, todayAwards: [
          { label: '기본 제출 +10', amount: 10 }, { label: '정시 제출 +5', amount: 5 }, { label: 'A반 2등 제출 +5', amount: 5 }
        ] },
        tier: { current: 'Starter', next: 'Builder', progress: 275 / 300, need: 25 },
        streak: 5 };
    },
    _mockValid: 0,
    _silentWav: function (sec) {
      var rate = 8000, n = Math.floor(rate * sec);
      var buf = new ArrayBuffer(44 + n), v = new DataView(buf);
      var ws = function (o, s) { for (var i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
      ws(0, 'RIFF'); v.setUint32(4, 36 + n, true); ws(8, 'WAVEfmt '); v.setUint32(16, 16, true);
      v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, rate, true); v.setUint32(28, rate, true);
      v.setUint16(32, 1, true); v.setUint16(34, 8, true); ws(36, 'data'); v.setUint32(40, n, true);
      new Uint8Array(buf, 44).fill(128);
      return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
    },
    getListenData: function (token, itemId) {
      return { ok: true, item_id: itemId, subject: '기사', label: 'Article 3 · 단어 듣기',
        transcript: 'apple 사과\nbanana 바나나\ncherry 체리\n(mock 음원은 2초 무음입니다)',
        audio_url: this._silentWav(2), required: 2, valid_count: this._mockValid, status: '미시작' };
    },
    recordListenSession: function (token, itemId, startedAt, completed, skipped) {
      if (completed && !skipped) this._mockValid++;
      var done = this._mockValid >= 2;
      return { ok: true, valid_count: this._mockValid, required: 2,
        item_status: done ? '제출완료' : '진행중', just_completed: done && this._mockValid === 2,
        awards: done ? [{ label: '기본 제출', amount: 10 }, { label: '정시 제출', amount: 5 }] : [] };
    },
    _mockAttempt: 0,
    submitRecording: function (token, itemId, base64, mimeType) {
      this._mockAttempt++;
      return { ok: true, attempt_no: this._mockAttempt, submitted_at: '21:05',
        flag: this._mockAttempt >= 3 ? '해시중복의심' : '',
        awards: this._mockAttempt === 1 ? [{ label: '기본 제출', amount: 10 }, { label: 'A반 1등 제출', amount: 8 }] : [],
        sizeKB: Math.round((base64 || '').length * 3 / 4 / 1024) };
    },
    // 배부 v2: groupId 없으면 반 목록만, 있으면 그 반의 요일 플랜(서버와 같은 모양)
    getAssignBootstrap: function (token, groupId, weekday) {
      var wd = weekday || ['일','월','화','수','목','금','토'][new Date().getDay()];
      var base = { ok: true, weekday: wd, date: '2026-07-27', groups: [
        { group_id: 'G-A', group_name: 'A반', level: 'Lv3', level_band: 'Lv1plus', student_count: 2 },
        { group_id: 'G-B', group_name: 'B반', level: 'Lv1', level_band: 'Lv1plus', student_count: 1 }
      ] };
      if (!groupId) return base;
      var CUR = {
        '월': [{ subject: '리딩', default_books: ['SB','WB'], actions: ['textbook_read','voca_record'], notes: '' }],
        '화': [{ subject: '그래머', default_books: ['SB','WB'], actions: ['textbook_read','grammar_word_record','pattern_read','voca_record'], notes: '' }],
        '수': [{ subject: '리스닝', default_books: ['SB','WB'], actions: ['textbook_listen','voca_record'], notes: '' }],
        '목': [{ subject: '기사', default_books: [], actions: ['article_read','article_word','voca_record'], notes: '' }],
        '금': [{ subject: '기사심화', default_books: [], actions: ['article_read_all','voca_record'], notes: '' }],
        '토': [{ subject: '예습', default_books: [], actions: ['preview_listen','preview_read','voca_record'], notes: '' }],
        '일': [{ subject: '예습', default_books: [], actions: ['preview_listen','preview_read','voca_record'], notes: '' }]
      };
      base.group = base.groups.filter(function (g) { return g.group_id === groupId; })[0];
      base.curriculum = CUR[wd] || [];
      base.textbooks = [
        { book_id: 'RD-01-SB', subject: '리딩', book_type: 'SB', series: 'Bricks Reading', label: '30-1', seq: 1, title: '', total_pages: 60 },
        { book_id: 'RD-02-SB', subject: '리딩', book_type: 'SB', series: 'Bricks Reading', label: '40-1', seq: 2, title: '', total_pages: 60 },
        { book_id: 'RD-01-WB', subject: '리딩', book_type: 'WB', series: 'Bricks Reading', label: '30-1', seq: 1, title: '', total_pages: 40 },
        { book_id: 'GR-01-SB', subject: '그래머', book_type: 'SB', series: 'Grammar ELT', label: 'Starter 1', seq: 1, title: '', total_pages: 70 },
        { book_id: 'GR-01-WB', subject: '그래머', book_type: 'WB', series: 'Grammar ELT', label: 'Starter 1', seq: 1, title: '', total_pages: 50 },
        { book_id: 'LS-01-SB', subject: '리스닝', book_type: 'SB', series: 'Bricks Listening', label: '50-1', seq: 1, title: '', total_pages: 50 },
        { book_id: 'LS-01-WB', subject: '리스닝', book_type: 'WB', series: 'Bricks Listening', label: '50-1', seq: 1, title: '', total_pages: 40 }
      ];
      base.progress = { '리딩|SB': { subject: '리딩', book_type: 'SB', book_id: 'RD-01-SB', series: 'Bricks Reading', label: '30-1', current_page: 12, next_page: 13, total_pages: 60 } };
      base.students = [
        { student_id: 'S001', name: '김철수', voca_count: 3, read_count: 1, pattern_count: 0 },
        { student_id: 'S002', name: '이영희', voca_count: 1, read_count: 2, pattern_count: 3 }
      ];
      base.contents = [{ content_id: 'C-ART-002', subject: '기사', title: 'Boy Climbs Huge Rock', units: [
        { content_unit_id: 'CU-ART-002-WORD', unit_type: 'word_listen', unit_label: '단어', subject: '기사' },
        { content_unit_id: 'CU-ART-002-BODY', unit_type: 'body_listen', unit_label: '본문', subject: '기사' }
      ] }];
      return base;
    },
    createAssignments: function (token, payload) {
      // 서버와 같은 규칙으로 학생별 회수를 확장해 건수를 계산(화면 요약과 대조용)
      var studs = [ { voca_count: 3, read_count: 1, pattern_count: 0 }, { voca_count: 1, read_count: 2, pattern_count: 3 } ];
      var total = 0, n = 0;
      studs.forEach(function (s) {
        var c = 0;
        (payload.items || []).forEach(function (it) { c += it.count_field ? (s[it.count_field] || 0) : 1; });
        if (c > 0) { n++; total += c; }
      });
      return { ok: true, students: n, items: total, batch_id: 'B-mock', progress_updated: 1 };
    }
  };
  // mock도 실서버와 똑같이 bodyOf를 거친 뒤, 그 body에서 인자를 되꺼내 호출한다.
  // 이렇게 해야 "화면은 넘겼는데 매핑에서 빠진" 인자가 로컬 미리보기에서도 그대로 재현된다.
  return {
    call: function (fn, args, onOk) {
      var body = bodyOf(fn, args);
      var passed = ARG_NAMES[fn].map(function (n) { return body[n]; });
      setTimeout(function () { onOk(MOCK[fn].apply(MOCK, passed)); }, 150);
    }
  };
})();

// ===== 거울 모드 (설계결정문서 5.4) — 독립 모듈 =====
// 듣기·녹음 화면에 들어가면 자동으로 켜지고, 화면을 떠나면 즉시 완전히 꺼진다.
// 동의를 묻지 않는다(학생이 스스로 켤 이유가 없으므로). 저장하지 않으며 "저장 안 됨"을 프리뷰에 상시 표시.
// 카메라를 못 켜거나 거부해도 학습에는 지장이 없으므로 조용히 넘어간다.
var Mirror = (function () {
  var stream = null;
  var wanted = false; // 지금 학습화면에 있어 켜져 있어야 하는가 (getUserMedia 비동기 경쟁 방지용)
  function $(id) { return document.getElementById(id); }

  // 듣기/녹음 화면 진입 → 자동 켜기
  function enter() {
    wanted = true;
    if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) return;
    if (stream) { showPreview(); return; }
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false })
      .then(function (s) {
        // 스트림이 준비되기 전에 화면을 떠났으면 바로 정리 (카메라가 켜진 채 남지 않도록)
        if (!wanted) { s.getTracks().forEach(function (t) { t.stop(); }); return; }
        stream = s;
        $('mirror-video').srcObject = s;
        showPreview();
      })
      .catch(function () { /* 카메라 거부/불가 — 무시 */ });
  }
  function showPreview() { if (stream) $('mirror-preview').classList.remove('hidden'); }
  // 학습화면 이탈·로그아웃 → 카메라 완전 종료 (프리뷰만 숨기는 게 아니라 스트림을 끈다)
  function stop() {
    wanted = false;
    if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
    var v = $('mirror-video'); if (v) v.srcObject = null;
    $('mirror-preview').classList.add('hidden');
  }
  return { enter: enter, stop: stop };
})();

// ===== T-01 숙제 배부 (선생님) — 독립 모듈 =====
// 반/학생 선택 → 콘텐츠 선택 → 표준 항목 체크 → 마감 설정 → "N명에게 M건" 확인 후 생성.
/**
 * Assign — 숙제 배부 화면 T-01 (배부 v2, Stage 3)
 *
 * 흐름: 반 선택 → 그 반의 오늘 요일 커리큘럼 자동 표시 → SB/WB 토글 + 페이지 가로 다이얼
 *       (진도 이어받기) → 자유 항목 → 확인 → 배부.
 * 회수(Voca 몇 번 등)는 여기서 묻지 않는다. 학생마다 다르고 서버가 자동 확장한다.
 * 서버 규약은 Assign.gs 상단 주석 참조.
 */
var Assign = (function () {
  function $(id) { return document.getElementById(id); }
  var token = null, boot = null, plan = null;   // boot=반 목록, plan=선택한 반의 요일 플랜
  var groupId = null, weekday = null, rows = [];
  var DAYS = ['일', '월', '화', '수', '목', '금', '토'];

  // 교재 페이지를 쓰는 액션 / 학생별 회수로 확장되는 액션 / 콘텐츠(음원)가 필요한 액션
  var PAGE_ACTIONS = { textbook_read: 1, textbook_listen: 1, coursebook: 1, write: 1 };
  var COUNT_FIELD = { voca_record: 'voca_count', article_read: 'read_count', pattern_read: 'pattern_count' };
  var CONTENT_ACTIONS = { article_read: 1, article_word: 1, article_read_all: 1, preview_listen: 1, preview_read: 1 };
  var LABELS = {
    textbook_read: '교재 읽기', textbook_listen: '교재 듣기', coursebook: '코스북',
    grammar_word_record: '단어장 녹음', pattern_read: '패턴 읽기', voca_record: 'Voca 암송',
    article_read: '기사 읽기', article_word: '기사 단어 듣기', article_read_all: '기사 전체 읽기',
    preview_listen: '예습 듣기', preview_read: '예습 읽기', write: '쓰기', extra: '자유 항목'
  };

  function open(sess) {
    token = sess.token;
    App.show('screen-assign');
    groupId = null; plan = null; rows = [];
    $('asg-plan-sec').classList.add('hidden');
    $('asg-due-sec').classList.add('hidden');
    $('asg-groups').innerHTML = '<div class="asg-hint">불러오는 중...</div>';
    $('asg-day').innerHTML = '';
    msg('');
    Server.call('getAssignBootstrap', [token, null, null], function (res) {
      if (!res.ok) {
        if (res.needLogin) { App.logout(); return; }
        $('asg-groups').innerHTML = '<div class="asg-hint">불러오지 못했어요. 다시 로그인해주세요.</div>';
        return;
      }
      boot = res;
      weekday = res.weekday;
      renderGroups();
      renderDays();
      updateSummary();
    });
  }

  function renderGroups() {
    var box = $('asg-groups');
    box.innerHTML = '';
    boot.groups.forEach(function (g) {
      var b = document.createElement('button');
      b.className = 'asg-chip' + (g.group_id === groupId ? ' on' : '');
      b.innerHTML = '';
      b.appendChild(document.createTextNode(g.group_name));
      var s = document.createElement('small');
      s.textContent = (g.level || '레벨 미정') + ' · ' + g.student_count + '명';
      b.appendChild(s);
      b.onclick = function () { selectGroup(g.group_id); };
      box.appendChild(b);
    });
  }

  function renderDays() {
    var box = $('asg-day');
    box.innerHTML = '';
    var today = boot.weekday;
    ['월', '화', '수', '목', '금', '토', '일'].forEach(function (d) {
      var b = document.createElement('button');
      b.className = 'asg-day' + (d === weekday ? ' on' : '') + (d === today ? ' today' : '');
      b.textContent = d;
      b.onclick = function () { weekday = d; renderDays(); if (groupId) loadPlan(); };
      box.appendChild(b);
    });
  }

  function selectGroup(gid) {
    groupId = gid;
    renderGroups();
    loadPlan();
  }

  /** @param keepMsg 배부 직후 재조회처럼 안내 문구를 지우면 안 될 때 true */
  function loadPlan(keepMsg) {
    $('asg-plan-sec').classList.remove('hidden');
    $('asg-plan').innerHTML = '<div class="asg-hint">불러오는 중...</div>';
    $('asg-plan-sub').textContent = '';
    if (!keepMsg) msg('');
    Server.call('getAssignBootstrap', [token, groupId, weekday], function (res) {
      if (!res.ok) {
        if (res.needLogin) { App.logout(); return; }
        $('asg-plan').innerHTML = '<div class="asg-hint">' + (res.message || '불러오지 못했어요.') + '</div>';
        return;
      }
      plan = res;
      buildRows();
      renderPlan();
      $('asg-due-sec').classList.remove('hidden');
      $('asg-due-date').value = dateForWeekday(weekday);
      updateSummary();
    });
  }

  /** 선택한 요일에 해당하는 가장 가까운 날짜(오늘 포함, 미래 방향) — 마감일 기본값 */
  function dateForWeekday(w) {
    var t = new Date();
    var want = DAYS.indexOf(w);
    var diff = (want - t.getDay() + 7) % 7;
    t.setDate(t.getDate() + diff);
    return t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0');
  }

  /** 커리큘럼 → 화면 행 목록. 교재 행은 SB/WB로 쪼갠다(진도가 따로 나가므로) */
  function buildRows() {
    rows = [];
    (plan.curriculum || []).forEach(function (c) {
      c.actions.forEach(function (action) {
        if (PAGE_ACTIONS[action]) {
          var types = (c.default_books && c.default_books.length) ? c.default_books : ['SB'];
          types.forEach(function (bt) {
            var pr = (plan.progress || {})[c.subject + '|' + bt] || {};
            var start = pr.next_page || 1;
            rows.push({
              on: true, action: action, subject: c.subject, book_type: bt,
              book_id: pr.book_id || defaultBook(c.subject, bt),
              page_start: start, page_end: start,
              prev_page: pr.current_page || 0
            });
          });
        } else {
          rows.push({
            on: true, action: action, subject: c.subject,
            count_field: COUNT_FIELD[action] || '',
            content_unit_id: '', required_listens: action === 'article_word' ? 1 : 0
          });
        }
      });
    });
    var sub = (plan.curriculum || []).map(function (c) { return c.subject; }).join(' · ');
    $('asg-plan-sub').textContent = plan.group ? ('· ' + weekday + '요일 · ' + sub) : '';
  }

  /** 카드 제목: 과목을 앞에 붙이되, 라벨이 이미 과목으로 시작하면 중복시키지 않는다("기사 기사 읽기" 방지) */
  function rowTitle(row) {
    var label = LABELS[row.action] || row.action;
    var subj = row.subject || '';
    if (!subj || label.indexOf(subj) === 0) return label;
    return subj + ' ' + label;
  }

  function defaultBook(subject, bt) {
    var list = (plan.textbooks || []).filter(function (t) { return t.subject === subject && t.book_type === bt; });
    return list.length ? list[0].book_id : '';
  }

  function bookTitle(bookId) {
    var b = (plan.textbooks || []).filter(function (t) { return t.book_id === bookId; })[0];
    return b ? (b.series + ' ' + b.label) : '';
  }

  function renderPlan() {
    var box = $('asg-plan');
    box.innerHTML = '';
    if (!rows.length) {
      box.innerHTML = '<div class="asg-hint">' + weekday + '요일 커리큘럼이 없어요. Curriculum 시트를 확인해주세요.</div>';
      return;
    }
    rows.forEach(function (row, i) { box.appendChild(renderRow(row, i)); });
  }

  function renderRow(row, i) {
    var card = document.createElement('div');
    card.className = 'asg-card' + (row.on ? '' : ' off');

    var head = document.createElement('div');
    head.className = 'asg-card-h';
    var cb = document.createElement('input');
    cb.type = 'checkbox'; cb.checked = row.on;
    cb.onchange = function () { row.on = cb.checked; renderPlan(); updateSummary(); };
    var t = document.createElement('div');
    t.className = 'asg-card-t';
    t.textContent = row.custom_label || rowTitle(row);
    head.appendChild(cb); head.appendChild(t);

    if (row.book_type) {
      var tag = document.createElement('span');
      tag.className = 'asg-card-tag'; tag.textContent = row.book_type;
      head.appendChild(tag);
    }
    if (row.custom) {
      var del = document.createElement('button');
      del.className = 'asg-del'; del.textContent = '✕'; del.title = '삭제';
      del.onclick = function () { rows.splice(i, 1); renderPlan(); updateSummary(); };
      head.appendChild(del);
    }
    card.appendChild(head);

    var body = document.createElement('div');
    body.className = 'asg-card-b';

    // 1) 교재 페이지 행: 책 선택 + 시작/끝 페이지 가로 다이얼
    if (PAGE_ACTIONS[row.action] && !row.custom) {
      body.appendChild(bookSelect(row));
      body.appendChild(pageDial(row, 'page_start', '시작'));
      body.appendChild(pageDial(row, 'page_end', '끝'));
      if (row.prev_page) {
        var p = document.createElement('div');
        p.className = 'asg-auto';
        p.innerHTML = '지난 진도 <b>' + row.prev_page + '쪽</b>까지 — 이어서 시작해요.';
        body.appendChild(p);
      }
    }

    // 2) 콘텐츠(음원)가 필요한 행: 어떤 기사/콘텐츠인지 선택
    if (CONTENT_ACTIONS[row.action] && !row.custom) {
      body.appendChild(contentSelect(row));
    }

    // 3) 학생별 회수로 늘어나는 행: 여기서 묻지 않고 안내만
    if (row.count_field) {
      var a = document.createElement('div');
      a.className = 'asg-auto';
      a.innerHTML = '학생별 회수 자동 — ' + countSummary(row.count_field);
      body.appendChild(a);
    }

    // 4) 자유 항목: 라벨 직접 입력
    if (row.custom) {
      var inp = document.createElement('input');
      inp.className = 'asg-book'; inp.placeholder = '예: 프린트 3장 풀기';
      inp.value = row.custom_label || '';
      inp.oninput = function () { row.custom_label = inp.value; t.textContent = inp.value || '자유 항목'; updateSummary(); };
      body.appendChild(inp);
    }

    card.appendChild(body);
    return card;
  }

  function bookSelect(row) {
    var sel = document.createElement('select');
    sel.className = 'asg-book';
    var list = (plan.textbooks || []).filter(function (t) {
      return t.subject === row.subject && t.book_type === row.book_type;
    });
    if (!list.length) {
      var o = document.createElement('option');
      o.textContent = row.subject + ' ' + row.book_type + ' 교재가 없어요';
      sel.appendChild(o); sel.disabled = true;
      return sel;
    }
    list.forEach(function (b) {
      var o = document.createElement('option');
      o.value = b.book_id;
      o.textContent = b.series + ' ' + b.label;
      if (b.book_id === row.book_id) o.selected = true;
      sel.appendChild(o);
    });
    if (!row.book_id) row.book_id = list[0].book_id;
    sel.onchange = function () { row.book_id = sel.value; updateSummary(); };
    return sel;
  }

  function contentSelect(row) {
    var sel = document.createElement('select');
    sel.className = 'asg-book';
    var units = [];
    (plan.contents || []).forEach(function (c) {
      c.units.forEach(function (u) { units.push({ id: u.content_unit_id, label: c.title + ' · ' + u.unit_label }); });
    });
    if (!units.length) {
      var o = document.createElement('option');
      o.textContent = '등록된 콘텐츠가 없어요 (시트에 기사 추가 필요)';
      sel.appendChild(o); sel.disabled = true;
      return sel;
    }
    var none = document.createElement('option');
    none.value = ''; none.textContent = '— 콘텐츠 선택 —';
    sel.appendChild(none);
    units.forEach(function (u) {
      var o = document.createElement('option');
      o.value = u.id; o.textContent = u.label;
      if (u.id === row.content_unit_id) o.selected = true;
      sel.appendChild(o);
    });
    sel.onchange = function () { row.content_unit_id = sel.value; updateSummary(); };
    return sel;
  }

  /** 페이지 가로 다이얼 — 진도 이어받기(시작값=next_page). 페이지=가로, 검증된 프로토타입 방식 */
  function pageDial(row, field, label) {
    var wrap = document.createElement('div');
    var head = document.createElement('div');
    head.className = 'asg-dial-l';
    var name = document.createElement('span'); name.textContent = label + '쪽';
    var val = document.createElement('b'); val.textContent = row[field] + '쪽';
    head.appendChild(name); head.appendChild(val);
    wrap.appendChild(head);

    var strip = document.createElement('div');
    strip.className = 'asg-dial';
    var book = (plan.textbooks || []).filter(function (t) { return t.book_id === row.book_id; })[0];
    var max = (book && book.total_pages) ? book.total_pages : 80;
    var from = Math.max(1, (row.prev_page || 0) - 2);
    for (var p = from; p <= max; p++) {
      strip.appendChild(dialBtn(row, field, p, strip, val));
    }
    wrap.appendChild(strip);
    // 선택값이 보이도록 스크롤
    setTimeout(function () {
      var on = strip.querySelector('button.on');
      if (on && on.scrollIntoView) on.scrollIntoView({ block: 'nearest', inline: 'center' });
    }, 30);
    return wrap;
  }

  function dialBtn(row, field, p, strip, valEl) {
    var b = document.createElement('button');
    b.textContent = p;
    b.className = p === row[field] ? 'on'
      : (p > row.page_start && p < row.page_end ? 'between' : '');
    b.onclick = function () {
      row[field] = p;
      // 끝쪽이 시작쪽보다 앞이면 같이 밀어준다(잘못된 범위 방지)
      if (field === 'page_start' && row.page_end < p) row.page_end = p;
      if (field === 'page_end' && p < row.page_start) row.page_start = p;
      valEl.textContent = p + '쪽';
      renderPlan(); updateSummary();
    };
    return b;
  }

  function countSummary(field) {
    var counts = {};
    (plan.students || []).forEach(function (s) {
      var n = s[field] || 0;
      counts[n] = (counts[n] || 0) + 1;
    });
    return Object.keys(counts).sort().map(function (n) {
      return n + '회 ' + counts[n] + '명';
    }).join(' · ');
  }

  function addCustom() {
    if (!plan) { msg('반을 먼저 선택해주세요.', true); return; }
    rows.push({ on: true, custom: true, action: 'extra', subject: '', custom_label: '' });
    renderPlan(); updateSummary();
  }

  /** 화면 행 → 서버 payload items */
  function collectItems() {
    var items = [];
    rows.forEach(function (row) {
      if (!row.on) return;
      if (row.custom && !String(row.custom_label || '').trim()) return; // 라벨 없는 자유 항목은 제외
      var it = { action: row.action, subject: row.subject || (plan.curriculum[0] || {}).subject || '' };
      if (PAGE_ACTIONS[row.action] && !row.custom) {
        it.book_type = row.book_type; it.book_id = row.book_id;
        it.page_start = row.page_start; it.page_end = row.page_end;
      }
      if (row.count_field) it.count_field = row.count_field;
      if (row.content_unit_id) it.content_unit_id = row.content_unit_id;
      if (row.required_listens) it.required_listens = row.required_listens;
      if (row.custom) it.custom_label = String(row.custom_label).trim();
      items.push(it);
    });
    return items;
  }

  /** 학생별 회수를 반영한 실제 생성 건수(서버 확장 결과와 같아야 함) */
  function estimate(items) {
    var students = plan ? (plan.students || []) : [];
    var total = 0, per = [];
    students.forEach(function (s) {
      var n = 0;
      items.forEach(function (it) {
        n += it.count_field ? (s[it.count_field] || 0) : 1;
      });
      if (n > 0) { total += n; per.push(s.name + ' ' + n + '건'); }
    });
    return { students: per.length, items: total, detail: per.join(' · ') };
  }

  function updateSummary() {
    var el = $('asg-summary');
    var btn = $('asg-submit');
    if (!plan || !groupId) {
      el.textContent = '반을 선택하면 그날 숙제가 자동으로 표시돼요.';
      el.classList.remove('ready'); btn.disabled = true;
      return;
    }
    var items = collectItems();
    var est = estimate(items);
    if (!items.length || !est.items) {
      el.textContent = '배부할 항목을 하나 이상 켜주세요.';
      el.classList.remove('ready'); btn.disabled = true;
      return;
    }
    el.innerHTML = '<b>' + est.students + '명</b>에게 총 <b>' + est.items + '건</b><br>' +
      '<span style="font-size:12px">' + est.detail + '</span>';
    el.classList.add('ready');
    btn.disabled = false;
  }

  function submit() {
    if (!plan || !groupId) { msg('반을 선택해주세요.', true); return; }
    var items = collectItems();
    if (!items.length) { msg('배부할 항목을 하나 이상 켜주세요.', true); return; }
    var dueDate = $('asg-due-date').value;
    if (!dueDate) { msg('마감일을 선택해주세요.', true); return; }

    // 콘텐츠가 필요한데 안 고른 항목이 있으면 막는다(음원 없는 숙제 방지)
    var missing = items.filter(function (it) { return CONTENT_ACTIONS[it.action] && !it.content_unit_id; });
    if (missing.length) {
      msg('"' + (LABELS[missing[0].action] || missing[0].action) + '"의 콘텐츠를 선택해주세요.', true);
      return;
    }

    var est = estimate(items);
    var g = boot.groups.filter(function (x) { return x.group_id === groupId; })[0] || {};
    if (!confirm(g.group_name + ' ' + est.students + '명에게 ' + weekday + '요일 숙제 ' +
      est.items + '건을 배부할까요?\n(마감 ' + dueDate + ')')) return;

    var payload = {
      groupId: groupId,
      dueDate: dueDate,
      dueTime: $('asg-due-time').value || '21:00',
      weekday: weekday,
      subject: (plan.curriculum[0] || {}).subject || '숙제',
      items: items
    };
    var btn = $('asg-submit');
    btn.disabled = true; msg('배부 중...', false);
    Server.call('createAssignments', [token, payload], function (res) {
      btn.disabled = false;
      if (!res.ok) {
        if (res.needLogin) { App.logout(); return; }
        msg(res.message || '배부하지 못했어요. 다시 해보세요.', true);
        return;
      }
      msg('✅ ' + res.students + '명에게 ' + res.items + '건 배부 완료! 진도도 갱신됐어요.', false);
      loadPlan(true); // 갱신된 진도로 다시 그린다(다음 배부는 이어받은 페이지부터). 안내 문구는 유지

  }

  return { open: open, addCustom: addCustom, updateSummary: updateSummary, submit: submit };
})();

var App = (function () {

  // ===== S-01 오늘의 숙제 =====

  };
  var STATUS_CLASS = { '재제출요청': 'st-redo', '미시작': 'st-todo', '진행중': 'st-doing', '제출완료': 'st-done', '면제': 'st-done' };
  var STATUS_LABEL = { '재제출요청': '다시 제출!', '미시작': '시작하기', '진행중': '이어서 하기', '제출완료': '완료 ✓', '면제': '면제' };

  function loadDashboard(sess) {
    show('screen-loading');
    Server.call('getTodayDashboard', [sess.token], function (res) {
      if (!res.ok) {
        if (res.needLogin) { localStorage.removeItem(SESSION_KEY); loadBootstrap(); return; }
        alert(res.message || '불러오지 못했어요. 다시 해보세요.');

      }

    });
  }

  function renderDashboard(sess, d) {
    var dt = new Date(d.today + 'T00:00:00');

    $('dash-name').textContent = (sess.student ? sess.student.name : '') + ' 님, 오늘도 화이팅!';
    $('chip-point').textContent = '⭐ ' + d.points.total + 'P';
    $('chip-streak').textContent = d.streak > 0 ? '🔥 ' + d.streak + '일 연속' : '🌱 오늘부터 시작!';

    $('tier-cur').textContent = d.tier.current || 'Starter';
    $('tier-need').textContent = d.tier.next ? d.tier.next + '까지 ' + d.tier.need + 'P' : '최고 등급!';
    $('tier-fill').style.width = Math.round(Math.min(1, Math.max(0, d.tier.progress)) * 100) + '%';

    var awBox = $('awards-box');
    if (d.points.todayAwards.length) {

      d.points.todayAwards.forEach(function (a) {

    $('tp-fill').style.width = d.progress.total ? Math.round(d.progress.done / d.progress.total * 100) + '%' : '0%';

    // 서버 정렬과 무관하게 화면에서도 상태 우선 정렬을 보장 (재제출요청→미시작→진행중→완료→면제)
    var ORDER = { '재제출요청': 0, '미시작': 1, '진행중': 2, '제출완료': 3, '면제': 4 };
    d.cards.sort(function (x, y) {
      var s = (ORDER[x.status] !== undefined ? ORDER[x.status] : 9) - (ORDER[y.status] !== undefined ? ORDER[y.status] : 9);
      return s !== 0 ? s : String(x.due_date).localeCompare(String(y.due_date));

    var wrap = $('hw-cards');

      var subj = document.createElement('div');

      label.className = 'hw-label';

  function openItem(c) {

  // ===== S-03 녹음·제출 =====

  function rcSetState(state) {

    } else if (state === 'uploading') {
      main.className = 'rc-main-btn submit';

  }

  function rcStartTimer() {
    var t0 = Date.now();
    Rec.timer = setInterval(function () {
      $('rc-timer').textContent = fmtTime((Date.now() - t0) / 1000);

  }
  function rcStopTimer() { if (Rec.timer) { clearInterval(Rec.timer); Rec.timer = null; } }

  function openRecord(c) {
    Rec.item = c;

    $('rc-subject').textContent = c.subject + ' · ' + (ACTION_META[c.action_type] || ACTION_META.record).label;
    $('rc-title').textContent = c.label + (c.seq ? ' (' + c.seq + ')' : '');

    var tr = $('rc-transcript');

  function rcMainAction() {
    if (Rec.state === 'idle') {
      if (!window.Recorder || !Recorder.isSupported()) {
        $('rc-msg').textContent = '이 브라우저는 녹음을 지원하지 않아요. 크롬이나 사파리로 열어주세요.';

      Recorder.start().then(function () {
        rcSetState('recording');

        $('rc-msg').textContent = '마이크를 사용할 수 없어요. 마이크 권한을 허용해주세요.';
        $('rc-msg').className = 'ls-msg bad';
      });
    } else if (Rec.state === 'recording') {
      rcStopTimer();
      Recorder.stop().then(function (r) {
        Rec.blob = r.blob;
        Rec.mimeType = r.mimeType;
        $('rc-preview').src = URL.createObjectURL(r.blob);

      }).catch(function () {
        $('rc-msg').textContent = '녹음 저장에 실패했어요. 다시 해보세요.';
        $('rc-msg').className = 'ls-msg bad';

      });

  }

  function rcSubmit() {
    if (!Rec.blob) return;
    rcSetState('uploading');
    var sess = loadSession();
    Recorder.blobToBase64(Rec.blob).then(function (b64) {
      Server.call('submitRecording', [sess.token, Rec.item.item_id, b64, Rec.mimeType], function (res) {
        if (!res.ok) {

          $('rc-msg').textContent = res.message || '제출에 실패했어요. 다시 해보세요.';

        $('rc-msg').className = 'ls-msg bad';

  }

  // ===== S-02 듣기 학습 =====
  var Listen = { audio: null, itemId: null, sessionStart: null, maxReached: 0, skipped: false, playing: false, finished: false };

  function fmtTime(sec) {
    if (!isFinite(sec) || sec < 0) return '-:--';
    var m = Math.floor(sec / 60), s = Math.floor(sec % 60);
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  function openListen(c) {
    show('screen-loading');
    var sess = loadSession();
    Server.call('getListenData', [sess.token, c.item_id], function (res) {
      if (!res.ok) {
        if (res.needLogin) { localStorage.removeItem(SESSION_KEY); loadBootstrap(); return; }
        alert(res.message || '불러오지 못했어요.');
        loadDashboard(sess);
        return;
      }
      setupListen(res);
    });
  }

  function setupListen(d) {
    Listen.itemId = d.item_id;
    Listen.sessionStart = null;
    Listen.maxReached = 0;
    Listen.skipped = false;
    Listen.playing = false;
    Listen.finished = false;

    $('ls-subject').textContent = d.subject;
    $('ls-title').textContent = d.label;
    $('ls-count').textContent = d.valid_count;
    $('ls-required').textContent = d.required;
    var tr = $('ls-transcript');
    if (d.transcript) { tr.textContent = d.transcript; tr.classList.remove('empty'); }
    else { tr.textContent = '🎵 음원을 들으며 따라 읽어보세요'; tr.classList.add('empty'); }
    $('ls-msg').textContent = '';
    $('ls-msg').className = 'ls-msg';
    $('ls-fill').style.width = '0%';
    $('ls-cur').textContent = '0:00';
    $('ls-dur').textContent = '-:--';
    $('ls-play').textContent = '▶';
    $('ls-play').disabled = false;

    if (Listen.audio) { Listen.audio.pause(); Listen.audio.src = ''; }
    var audio = new Audio();
    audio.preload = 'metadata';
    Listen.audio = audio;

    // 음원 로드: mock은 audio_url(blob), 실서버는 GAS 프록시(base64→blob)
    // 드라이브 직링크는 <audio>에서 재생이 막혀 프록시 방식 사용 (2026-07-19)
    if (d.audio_url) {
      audio.src = d.audio_url;
    } else if (d.has_audio) {
      $('ls-msg').textContent = '음원 불러오는 중...';
      $('ls-msg').className = 'ls-msg';
      $('ls-play').disabled = true;
      var sess0 = loadSession();
      Server.call('getAudioForUnit', [sess0.token, d.content_unit_id], function (res) {
        if (!res.ok) {
          $('ls-msg').textContent = res.message || '음원을 불러올 수 없어요. 선생님께 알려주세요.';
          $('ls-msg').className = 'ls-msg bad';
          return;
        }
        var bin = atob(res.base64);
        var u8 = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
        audio.src = URL.createObjectURL(new Blob([u8], { type: res.mimeType || 'audio/mpeg' }));
        $('ls-msg').textContent = '';
        $('ls-play').disabled = false;
      }, function () {
        $('ls-msg').textContent = '연결이 불안정해요. 뒤로 갔다가 다시 들어와주세요.';
        $('ls-msg').className = 'ls-msg bad';
      });
    } else {
      $('ls-msg').textContent = '음원이 아직 등록되지 않았어요. 선생님께 알려주세요.';
      $('ls-msg').className = 'ls-msg bad';
      $('ls-play').disabled = true;
    }

    // OS 미디어 컨트롤의 탐색 버튼 미등록 (설계결정문서 5.3 — MediaSession seek 핸들러 등록 안 함)
    if ('mediaSession' in navigator) {
      ['seekbackward', 'seekforward', 'seekto'].forEach(function (a) {
        try { navigator.mediaSession.setActionHandler(a, null); } catch (e) {}
      });
    }

    audio.addEventListener('loadedmetadata', function () { $('ls-dur').textContent = fmtTime(audio.duration); });
    audio.addEventListener('timeupdate', function () {
      if (audio.currentTime > Listen.maxReached) Listen.maxReached = audio.currentTime;
      if (audio.duration) $('ls-fill').style.width = Math.min(100, audio.currentTime / audio.duration * 100) + '%';
      $('ls-cur').textContent = fmtTime(audio.currentTime);
    });
    // UI 차단을 우회한 앞으로 건너뛰기 감지 (2차 안전장치). 되감기는 허용
    audio.addEventListener('seeking', function () {
      if (audio.currentTime > Listen.maxReached + 1.0) Listen.skipped = true;
    });
    audio.addEventListener('ended', function () { onListenEnded(); });
    audio.addEventListener('error', function () {
      $('ls-msg').textContent = '음원을 불러올 수 없어요. 선생님께 알려주세요.';
      $('ls-msg').className = 'ls-msg bad';
      $('ls-play').disabled = true;
    });

    $('ls-play').onclick = function () {
      if (Listen.playing) {
        audio.pause();
        Listen.playing = false;
        $('ls-play').textContent = '▶';
      } else {
        if (!Listen.sessionStart) Listen.sessionStart = new Date();
        audio.play();
        Listen.playing = true;
        $('ls-play').textContent = '⏸';
        $('ls-msg').textContent = '';
        $('ls-msg').className = 'ls-msg';
      }
    };
    $('ls-restart').onclick = function () {
      // 처음부터 = 새 세션 시작 (되감기 허용, 이전 진행은 기록하지 않음)
      audio.currentTime = 0;
      Listen.maxReached = 0;
      Listen.skipped = false;
      Listen.sessionStart = new Date();
      if (!Listen.playing) { audio.play(); Listen.playing = true; $('ls-play').textContent = '⏸'; }
    };
    show('screen-listen');
  }

  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function tsStr(d) {
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) + ' ' +
      pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds());
  }

  function onListenEnded() {
    Listen.playing = false;
    Listen.finished = true;
    $('ls-play').textContent = '▶';
    $('ls-msg').textContent = '기록 중...';
    var sess = loadSession();
    var started = Listen.sessionStart ? tsStr(Listen.sessionStart) : tsStr(new Date());
    Server.call('recordListenSession', [sess.token, Listen.itemId, started, true, Listen.skipped], function (res) {
      if (!res.ok) {
        $('ls-msg').textContent = res.message || '기록에 실패했어요. 한 번 더 들어주세요.';
        $('ls-msg').className = 'ls-msg bad';
        return;
      }
      $('ls-count').textContent = res.valid_count;
      $('ls-required').textContent = res.required;
      if (res.just_completed) {
        var earned = (res.awards || []).reduce(function (sum, a) { return sum + a.amount; }, 0);
        $('ls-msg').textContent = '🎉 유효 듣기 달성!' + (earned ? ' +' + earned + 'P' : '') + ' 오늘의 숙제로 돌아가요';
        $('ls-msg').className = 'ls-msg good';
        setTimeout(function () { loadDashboard(sess); }, 1800);
      } else if (Listen.skipped) {
        $('ls-msg').textContent = '건너뛰기가 감지돼 이번 회차는 인정되지 않았어요. 처음부터 다시!';
        $('ls-msg').className = 'ls-msg bad';
        Listen.skipped = false;
        Listen.maxReached = 0;
        Listen.sessionStart = null;
      } else {
        $('ls-msg').textContent = '✅ 유효 듣기 1회 완료! (' + res.valid_count + '/' + res.required + ')';
        $('ls-msg').className = 'ls-msg good';
        Listen.sessionStart = null;
        Listen.maxReached = 0;
      }
    });
  }

  function closeListen() {
    if (Listen.playing && !Listen.finished) {
      if (!confirm('아직 다 듣지 않았어요. 지금 나가면 이번 듣기는 인정되지 않아요. 나갈까요?')) return;
    }
    if (Listen.audio) { Listen.audio.pause(); }
    loadDashboard(loadSession());
  }

  function logout() {
    localStorage.removeItem(SESSION_KEY);
    selGroup = selStudent = null;
    Mirror.stop();
    if (bootstrap) renderGroups(); else loadBootstrap();
  }

  return {
    init: init,
    show: show,
    showGroups: renderGroups,
    showTeacherLogin: function () { showPin('teacher'); },
    closeListen: closeListen,
    logout: logout
  };
})();

App.init();

// ===== 빌드 표식 =====
// 폰이 어떤 셸 버전을 쓰는지 로그인 화면에서 눈으로 확인하기 위한 표식.
// sw.js의 CACHE_VERSION과 함께 올린다. 폰에 이 값이 안 보이면 구버전 캐시를 쓰는 것.
var BUILD_VERSION = 'shell-v12';
(function () {
  var el = document.getElementById('build-stamp');
  if (el) el.textContent = BUILD_VERSION;
})();

// ===== 서비스워커 등록 (PWA 설치·오프라인 셸) =====
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js');
  // 새 서비스워커가 제어를 넘겨받으면 페이지를 한 번 리로드해 최신 셸을 즉시 반영한다.
  // (이게 없으면 새 SW가 활성화돼도 이미 로드된 구버전 화면이 그대로 남는다 — iOS 설치형 PWA에서 특히 문제)
  var swRefreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (swRefreshing) return;
    swRefreshing = true;
    window.location.reload();
  });
}
</script>
