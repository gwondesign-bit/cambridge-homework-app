    cmt.className = 'rv-cmt';
    cmt.placeholder = '피드백 (반려하려면 반드시 사유를 적어주세요)';
    cmt.value = r.comment || '';
    p.appendChild(cmt);

    var row = document.createElement('div');
    row.className = 'rv-actions';
    var ok = document.createElement('button');
    ok.className = 'rv-btn primary';
    ok.textContent = '✓ 확인 완료';
    ok.onclick = function () {
      act('reviewSubmission', [token, r.submission_id, 'approve', cmt.value], r.student_name + ' 확인 완료.');
    };
    var no = document.createElement('button');
    no.className = 'rv-btn danger';
    no.textContent = '↩ 반려(재제출 요청)';
    no.onclick = function () {
      if (!String(cmt.value).trim()) { msg('반려 사유를 적어주세요. 학생에게 그대로 전달됩니다.', true); return; }
      if (!confirm(r.student_name + '에게 재제출을 요청할까요?\n제출한 녹음은 지워지지 않고 이력으로 남습니다.')) return;
      act('reviewSubmission', [token, r.submission_id, 'reject', cmt.value], r.student_name + '에게 재제출 요청했어요.');
    };
    row.appendChild(ok); row.appendChild(no);
    p.appendChild(row);
    return p;
  }

  function act(action, args, okMsg) {
    msg('처리 중...');
    Server.call(action, args, function (res) {
      if (!res.ok) {
        if (res.needLogin) { App.logout(); return; }
        msg(res.message || '처리하지 못했어요.', true);
        return;
      }
      openItem = null;
      msg(okMsg);
      load(true);
    });
  }

  function msg(text, isErr) {
    var el = $('rv-msg');
    if (!el) return;
    el.textContent = text || '';
    el.style.color = isErr ? 'var(--danger)' : 'var(--muted)';
  }

  return { open: open };
})();

/**
 * Manage — 원생·반 관리 T-04
 *
 * 여기서 정하는 것(몇 달에 한 번): 반 레벨 / 과목별 교재(SB·WB 한 쌍) / 반 기본 회수 / 반 배정.
 * 회수는 반 기본값을 두고 학생은 예외만 저장한다 — 대부분 회수가 같은데 학생마다 입력하면
 * 20명 × 3칸 노가다가 되기 때문(원장 피드백 2026-07-25).
 */
var Manage = (function () {
  function $(id) { return document.getElementById(id); }
  var token = null, data = null, groupId = null, picking = false;

  /**
   * 변경분(draft) — 값을 바꿔도 바로 저장하지 않고 여기 모아뒀다가 확인 버튼에서 한 번에 보낸다.
   * GAS 왕복이 1~3초라 스테퍼를 세 번 누르면 저장이 세 번 나가던 문제를 없앤 것.
   * { level, defaults:{}, books:{과목:seq}, students:{학생:{필드:값|null}}, moves:{학생:반} }
   */
  var draft = null;
  function resetDraft() { draft = { level: null, defaults: {}, books: {}, students: {}, moves: {} }; }
  function dirtyCount() {
    if (!draft) return 0;
    return (draft.level ? 1 : 0) + Object.keys(draft.defaults).length + Object.keys(draft.books).length +
      Object.keys(draft.students).length + Object.keys(draft.moves).length;
  }

  // ---- 화면에 보여줄 "지금 값" = 원본에 draft를 얹은 것 ----
  function effLevel(g) { return draft.level || g.level; }
  function effDefault(g, f) {
    return draft.defaults[f] !== undefined ? draft.defaults[f] : g.defaults[f];
  }
  function effBookSeq(g, subj) {
    if (draft.books[subj] !== undefined) return draft.books[subj];
    return ((g.settings || {})[subj] || {}).book_seq || 0;
  }
  /** 학생 회수: draft → 학생 예외 → 반 기본값 (서버 resolveCounts_와 같은 순서) */
  function effCount(g, st, f) {
    var d = draft.students[st.student_id];
    if (d && d[f] !== undefined) {
      return d[f] === null ? effDefault(g, f) : d[f];
    }
    if (st.overrides && st.overrides[f] !== undefined) return st.overrides[f];
    return effDefault(g, f);
  }
  /** 이 학생이 지금 예외 상태인가(저장 전 변경분 포함) */
  function effOverrides(g, st) {
    var out = {};
    COUNTS.forEach(function (c) {
      var f = c.field;
      var d = draft.students[st.student_id];
      if (d && d[f] !== undefined) { if (d[f] !== null) out[f] = d[f]; return; }
      if (st.overrides && st.overrides[f] !== undefined) out[f] = st.overrides[f];
    });
    return out;
  }
  /** 값이 반 기본값과 같아지면 예외를 없앤다(null = 기본값 따름) */
  function setStudentCount(g, st, field, next) {
    if (!draft.students[st.student_id]) draft.students[st.student_id] = {};
    draft.students[st.student_id][field] = (next === effDefault(g, field)) ? null : next;
    render();
  }
  // 교재 표시명 — 라벨에 이미 시리즈명이 들어간 교재가 있어(예: "Grammar ELT 1") 중복을 막는다
  function bookName(series, label) {
    series = String(series || '').trim(); label = String(label || '').trim();
    if (!series) return label;
    return label.indexOf(series) === 0 ? label : (series + ' ' + label);
  }
  var COUNTS = [
    { field: 'voca_count', label: 'Voca 암송' },
    { field: 'read_count', label: '기사 읽기' },
    { field: 'pattern_count', label: '패턴 읽기' }
  ];

  function open(s) {
    token = s.token;
    App.show('screen-manage');
    picking = false;
    resetDraft();
    $('mng-body').innerHTML = '<div class="asg-hint">불러오는 중...</div>';
    msg('');
    Server.call('getManageData', [token], function (res) {
      if (!res.ok) {
        if (res.needLogin) { App.logout(); return; }
        $('mng-body').innerHTML = '<div class="asg-hint">불러오지 못했어요.</div>';
        return;
      }
      data = res;
      if (!groupId || !group()) groupId = (data.groups[0] || {}).group_id || null;
      renderGroups();
      render();
    });
  }

  function group() {
    return (data.groups || []).filter(function (g) { return g.group_id === groupId; })[0] || null;
  }

  function renderGroups() {
    var box = $('mng-groups');
    box.innerHTML = '';
    data.groups.forEach(function (g) {
      var b = document.createElement('button');
      b.className = 'asg-chip' + (g.group_id === groupId ? ' on' : '');
      b.appendChild(document.createTextNode(g.group_name));
      var s = document.createElement('small');
      s.textContent = (g.level || '레벨 미정') + ' · ' + g.students.length + '명';
      b.appendChild(s);
      b.onclick = function () {
        if (g.group_id === groupId) return;
        // 저장 안 한 변경분이 있으면 반을 옮기기 전에 물어본다(조용히 날아가지 않게)
        if (dirtyCount() && !confirm('저장하지 않은 변경 ' + dirtyCount() + '건이 있어요.\n버리고 다른 반으로 갈까요?')) return;
        groupId = g.group_id; picking = false; resetDraft();
        renderGroups(); render(); msg('');
      };
      box.appendChild(b);
    });
  }

  function render() {
    var g = group();
    var box = $('mng-body');
    box.innerHTML = '';
    if (!g) { box.innerHTML = '<div class="asg-hint">반이 없어요.</div>'; return; }
    box.appendChild(levelSection(g));
    box.appendChild(bookSection(g));
    box.appendChild(countSection(g));
    box.appendChild(studentSection(g));
    box.appendChild(saveBar(g));
  }

  /** 변경분이 있을 때만 뜨는 저장 바 — 무엇이 바뀌는지 먼저 보여주고 한 번에 올린다 */
  function saveBar(g) {
    var wrap = document.createElement('div');
    var n = dirtyCount();
    if (!n) return wrap;

    var box = document.createElement('div');
    box.className = 'mng-save';
    var list = document.createElement('div');
    list.className = 'mng-save-list';
    changeSummary(g).forEach(function (line) {
      var d = document.createElement('div');
      d.textContent = '· ' + line;
      list.appendChild(d);
    });
    box.appendChild(list);

    var row = document.createElement('div');
    row.className = 'mng-save-row';
    var cancel = document.createElement('button');
    cancel.className = 'mng-btn';
    cancel.textContent = '되돌리기';
    cancel.onclick = function () {
      if (!confirm('바꾼 내용 ' + n + '건을 버릴까요?')) return;
      resetDraft(); render(); msg('');
    };
    var save = document.createElement('button');
    save.className = 'asg-btn';
    save.style.marginTop = '0';
    save.textContent = '변경 ' + n + '건 저장';
    save.onclick = function () { commit(g); };
    row.appendChild(cancel); row.appendChild(save);
    box.appendChild(row);
    wrap.appendChild(box);
    return wrap;
  }

  /** 저장 전에 보여줄 변경 요약 — 눌러놓고 뭐 바꿨는지 잊는 걸 막는다 */
  function changeSummary(g) {
    var out = [];
    if (draft.level) out.push('반 레벨 → ' + draft.level + ' (학생 레벨도 함께 바뀜)');
    Object.keys(draft.defaults).forEach(function (f) {
      out.push('기본 ' + labelOf(f) + ' → ' + draft.defaults[f] + '회');
    });
    Object.keys(draft.books).forEach(function (subj) {
      var b = (data.books[subj] || []).filter(function (x) { return x.seq === draft.books[subj]; })[0];
      out.push(subj + ' 교재 → ' + (b ? bookName(b.series, b.label) : '?') + ' (진도 1쪽부터 다시)');
    });
    Object.keys(draft.students).forEach(function (sid) {
      var st = (g.students || []).filter(function (x) { return x.student_id === sid; })[0];
      var name = st ? st.name : sid;
      Object.keys(draft.students[sid]).forEach(function (f) {
        var v = draft.students[sid][f];
        out.push(name + ' ' + labelOf(f) + ' → ' + (v === null ? '반 기본값' : v + '회'));
      });
    });
    Object.keys(draft.moves).forEach(function (sid) {
      var to = (data.groups || []).filter(function (x) { return x.group_id === draft.moves[sid]; })[0];
      var st = findStudent(sid);
      out.push((st ? st.name : sid) + ' → ' + (to ? to.group_name : draft.moves[sid]) + '으로 이동');
    });
    return out;
  }

  function findStudent(sid) {
    var found = null;
    (data.groups || []).forEach(function (g) {
      (g.students || []).forEach(function (s) { if (s.student_id === sid) found = s; });
    });
    (data.unassigned || []).forEach(function (s) { if (s.student_id === sid) found = s; });
    return found;
  }

  /** 모아둔 변경분을 한 번에 서버로 */
  function commit(g) {
    var changes = { groupId: groupId };
    if (draft.level) changes.level = draft.level;
    if (Object.keys(draft.defaults).length) changes.defaults = draft.defaults;
    if (Object.keys(draft.books).length) changes.books = draft.books;
    if (Object.keys(draft.students).length) changes.students = draft.students;
    if (Object.keys(draft.moves).length) changes.moves = draft.moves;

    msg('저장 중...');
    Server.call('saveManageBatch', [token, changes], function (res) {
      if (res.needLogin) { App.logout(); return; }
      if (!res.ok && res.message) { msg(res.message, true); return; }
      var failed = res.failed || [];
      open({ token: token });   // 서버 상태로 다시 그린다(draft도 비워짐)
      if (failed.length) msg('일부 저장 실패: ' + failed.join(' / '), true);
      else msg('저장했어요.');
    });
  }

  function section(title, sub) {
    var d = document.createElement('div');
    d.className = 'asg-sec';
    var t = document.createElement('div');
    t.className = 'asg-sec-t';
    t.textContent = title;
    if (sub) {
      var sp = document.createElement('span');
      sp.className = 'mng-sub'; sp.textContent = sub;
      t.appendChild(sp);
    }
    d.appendChild(t);
    return d;
  }

  // ---- 반 레벨: 바꾸면 학생 레벨·기사 번호가 함께 따라간다 ----
  function levelSection(g) {
    var sec = section('반 레벨');
    var row = document.createElement('div');
    row.className = 'mng-lv';
    var cur = effLevel(g);
    (data.levels || []).forEach(function (lv) {
      var b = document.createElement('button');
      b.className = 'mng-btn' + (lv === cur ? ' on' : '');
      b.textContent = lv;
      b.onclick = function () {
        if (lv === cur) return;
        draft.level = (lv === g.level) ? null : lv;  // 원래 값으로 되돌리면 변경분에서 뺀다
        render();
      };
      row.appendChild(b);
    });
    sec.appendChild(row);
    var n = document.createElement('div');
    n.className = 'mng-note';
    n.textContent = '레벨을 정하면 소속 학생 레벨과 기사 번호(' + (levelNo(cur) || 'x') + '-1, ' + (levelNo(cur) || 'x') + '-2 …)가 따라갑니다.';
    sec.appendChild(n);
    return sec;
  }

  function levelNo(level) {
    var m = String(level || '').match(/^Lv(\d+)$/i);
    if (m) return m[1];
    return /^Phonics$/i.test(String(level || '')) ? 'P' : '';
  }

  // ---- 과목별 교재: SB/WB는 한 쌍으로 함께 지정 ----
  function bookSection(g) {
    var sec = section('과목별 교재', '· 한 번 정하면 몇 달간 그대로');
    var subjects = Object.keys(data.books || {});
    if (!subjects.length) {
      sec.appendChild(hint('교재 목록이 비어 있어요. Textbooks 시트를 확인해주세요.'));
      return sec;
    }
    subjects.forEach(function (subj) {
      var saved = (g.settings || {})[subj] || { book_seq: 0, sb_page: 0, wb_page: 0 };
      var seq = effBookSeq(g, subj);
      var changed = draft.books[subj] !== undefined;
      var list = data.books[subj] || [];
      var chosen = list.filter(function (b) { return b.seq === seq; })[0];

      var row = document.createElement('div');
      row.className = 'mng-row';
      var main = document.createElement('div');
      main.className = 'mng-row-main';
      var t = document.createElement('div');
      t.className = 'mng-row-t';
      t.textContent = chosen ? bookName(chosen.series, chosen.label) : (subj + ' 교재 미지정');
      if (!chosen) t.style.color = 'var(--muted)';
      var s = document.createElement('div');
      s.className = 'mng-row-s';
      s.textContent = !chosen ? (subj + ' · 교재를 정해주세요')
        : changed ? (subj + ' · 저장하면 진도 1쪽부터 다시 시작')
        : (subj + ' · SB ' + saved.sb_page + '쪽 · WB ' + saved.wb_page + '쪽까지 나감');
      main.appendChild(t); main.appendChild(s);
      row.appendChild(main);

      if (changed) {
        var tag = document.createElement('span');
        tag.className = 'mng-tag warn'; tag.textContent = '변경';
        row.appendChild(tag);
      }
      var btn = document.createElement('button');
      btn.className = 'mng-btn';
      btn.textContent = chosen ? '바꾸기' : '고르기';
      btn.onclick = function () { openBookPicker(g, subj, list, seq, row); };
      row.appendChild(btn);
      sec.appendChild(row);
    });
    return sec;
  }

  function openBookPicker(g, subj, list, curSeq, afterRow) {
    var old = document.getElementById('mng-picker');
    if (old) old.remove();
    var box = document.createElement('div');
    box.id = 'mng-picker';
    box.className = 'mng-pick';
    var savedSeq = ((g.settings || {})[subj] || {}).book_seq || 0;
    list.forEach(function (b) {
      var r = document.createElement('button');
      r.className = 'mng-btn' + (b.seq === curSeq ? ' on' : '');
      r.style.width = '100%';
      r.style.textAlign = 'left';
      r.style.marginBottom = '5px';
      r.textContent = bookName(b.series, b.label) + (b.seq === savedSeq ? ' (지금)' : '');
      r.onclick = function () {
        // 원래 교재로 되돌리면 변경분에서 뺀다
        if (b.seq === savedSeq) delete draft.books[subj];
        else draft.books[subj] = b.seq;
        render();
      };
      box.appendChild(r);
    });
    afterRow.parentNode.insertBefore(box, afterRow.nextSibling);
  }

  // ---- 반 기본 회수: 여기 값이 전원에게 적용된다 ----
  function countSection(g) {
    var sec = section('반 기본 회수', '· 예외인 학생만 아래에서 따로');
    COUNTS.forEach(function (c) {
      sec.appendChild(stepper(c.label, effDefault(g, c.field), function (next) {
        // 원래 값으로 되돌리면 변경분에서 뺀다
        if (next === g.defaults[c.field]) delete draft.defaults[c.field];
        else draft.defaults[c.field] = next;
        render();
      }, draft.defaults[c.field] !== undefined));
    });
    var n = document.createElement('div');
    n.className = 'mng-note';
    n.textContent = '0으로 두면 그 항목은 아예 배부되지 않습니다.';
    sec.appendChild(n);
    return sec;
  }

  function stepper(label, value, onChange, changed) {
    var row = document.createElement('div');
    row.className = 'mng-cnt';
    var l = document.createElement('div');
    l.className = 'mng-cnt-l'; l.textContent = label;
    if (changed) {
      var tag = document.createElement('span');
      tag.className = 'mng-tag warn'; tag.textContent = '변경';
      tag.style.marginLeft = '6px';
      l.appendChild(tag);
    }
    var box = document.createElement('div');
    box.className = 'mng-step';
    var minus = document.createElement('button'); minus.textContent = '−';
    var val = document.createElement('span'); val.textContent = value + '회';
    var plus = document.createElement('button'); plus.textContent = '+';
    minus.onclick = function () { if (value > 0) onChange(value - 1); };
    plus.onclick = function () { if (value < 9) onChange(value + 1); };
    box.appendChild(minus); box.appendChild(val); box.appendChild(plus);
    row.appendChild(l); row.appendChild(box);
    return row;
  }

  // ---- 학생: 예외만 눈에 띄게. 반 배정도 여기서 ----
  function studentSection(g) {
    var sec = section('학생 ' + g.students.length + '명');

    g.students.forEach(function (st) {
      var row = document.createElement('div');
      row.className = 'mng-row';
      var main = document.createElement('div');
      main.className = 'mng-row-main';
      var t = document.createElement('div');
      t.className = 'mng-row-t';
      t.textContent = st.name;
      main.appendChild(t);

      var eff = effOverrides(g, st);
      var ov = Object.keys(eff);
      var s = document.createElement('div');
      s.className = 'mng-row-s';
      s.textContent = ov.length
        ? ov.map(function (f) { return labelOf(f) + ' ' + eff[f] + '회 (기본 ' + effDefault(g, f) + ')'; }).join(' · ')
        : '반 기본값 그대로';
      main.appendChild(s);
      row.appendChild(main);

      if (ov.length) {
        var tag = document.createElement('span');
        tag.className = 'mng-tag warn'; tag.textContent = '예외';
        row.appendChild(tag);
      }
      var btn = document.createElement('button');
      btn.className = 'mng-btn'; btn.textContent = '수정';
      btn.onclick = function () { openStudent(st, g, row); };
      row.appendChild(btn);
      sec.appendChild(row);
    });

    var add = document.createElement('button');
    add.className = 'asg-add';
    add.textContent = picking ? '닫기' : '＋ 다른 반·미배정 학생 담기';
    add.onclick = function () { picking = !picking; render(); };
    sec.appendChild(add);
    if (picking) sec.appendChild(studentPicker(g));
    return sec;
  }

  function labelOf(field) {
    var f = COUNTS.filter(function (c) { return c.field === field; })[0];
    return f ? f.label : field;
  }

  /** 반 화면에서 여러 명 한번에 담기(신학기 편성용) */
  function studentPicker(g) {
    var box = document.createElement('div');
    box.className = 'mng-pick';
    var others = [];
    (data.unassigned || []).forEach(function (s) { others.push({ s: s, from: '미배정' }); });
    (data.groups || []).forEach(function (og) {
      if (og.group_id === groupId) return;
      og.students.forEach(function (s) { others.push({ s: s, from: og.group_name }); });
    });
    if (!others.length) {
      box.appendChild(hint('담을 수 있는 학생이 없어요.'));
      return box;
    }
    var picked = {};
    others.forEach(function (o) {
      var lab = document.createElement('label');
      lab.className = 'asg-check';
      var cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.onchange = function () { picked[o.s.student_id] = cb.checked; };
      var sp = document.createElement('span');
      sp.textContent = o.s.name + ' (' + o.from + ')';
      lab.appendChild(cb); lab.appendChild(sp);
      box.appendChild(lab);
    });
    var go = document.createElement('button');
    go.className = 'mng-btn on';
    go.style.width = '100%';
    go.textContent = g.group_name + '으로 담기';
    go.onclick = function () {
      var ids = Object.keys(picked).filter(function (k) { return picked[k]; });
      if (!ids.length) { msg('옮길 학생을 선택해주세요.', true); return; }
      ids.forEach(function (sid) { draft.moves[sid] = groupId; });
      picking = false;
      render();
      msg('아래 저장 버튼을 누르면 반영돼요.');
    };
    box.appendChild(go);
    return box;
  }

  /** 학생 개별 예외 조정 — 값이 반 기본값과 같아지면 예외를 지운다 */
  function openStudent(st, g, afterRow) {
    var old = document.getElementById('mng-student');
    if (old) old.remove();
    var box = document.createElement('div');
    box.id = 'mng-student';
    box.style.padding = '4px 0 10px';

    COUNTS.forEach(function (c) {
      var d = draft.students[st.student_id];
      box.appendChild(stepper(c.label, effCount(g, st, c.field), function (next) {
        setStudentCount(g, st, c.field, next);
      }, !!(d && d[c.field] !== undefined)));
    });

    if (Object.keys(effOverrides(g, st)).length) {
      var reset = document.createElement('button');
      reset.className = 'mng-btn';
      reset.style.width = '100%';
      reset.textContent = '전부 반 기본값으로 되돌리기';
      reset.onclick = function () {
        draft.students[st.student_id] = { voca_count: null, read_count: null, pattern_count: null };
        render();
      };
      box.appendChild(reset);
    }

    var move = document.createElement('div');
    move.className = 'mng-note';
    move.textContent = '반 옮기기: ';
    (data.groups || []).forEach(function (og) {
      if (og.group_id === groupId) return;
      var b = document.createElement('button');
      b.className = 'mng-btn';
      b.style.marginLeft = '6px';
      b.textContent = og.group_name + '으로';
      b.onclick = function () {
        draft.moves[st.student_id] = og.group_id;
        render();
        msg('아래 저장 버튼을 누르면 반영돼요.');
      };
      move.appendChild(b);
    });
    box.appendChild(move);

    afterRow.parentNode.insertBefore(box, afterRow.nextSibling);
  }

  function hint(text) {
    var d = document.createElement('div');
    d.className = 'asg-hint'; d.textContent = text;
    return d;
  }

  /** 저장 안 한 변경분이 있는지 — 다른 화면으로 나갈 때 확인용 */
  function hasUnsaved() { return dirtyCount() > 0; }

  function msg(text, isErr) {
    var el = $('mng-msg');
    if (!el) return;
    el.textContent = text || '';
    el.style.color = isErr ? 'var(--danger)' : 'var(--muted)';
  }

  return { open: open, hasUnsaved: hasUnsaved };
})();

/**
 * Assign — 숙제 배부 화면 T-01 (배부 v2, Stage 3)
 *
 * 흐름: 반 선택 → 그 반의 오늘 요일 커리큘럼 자동 표시 → SB/WB 토글 + 페이지 가로 다이얼
 *       (진도 이어받기) → 자유 항목 → 확인 → 배부.
 * 회수(Voca 몇 번 등)는 여기서 묻지 않는다. 학생마다 다르고 서버가 자동 확장한다.
 * 서버 규약은 Assign.gs 상단 주석 참조.
 */
var Assign = (function () {
  function $(id) { return document.getElementById(id); }
  var token = null, boot = null, plan = null;   // boot=반 목록, plan=선택한 반의 요일 플랜
  var groupId = null, weekday = null, rows = [];
  var DAYS = ['일', '월', '화', '수', '목', '금', '토'];

  // 교재 페이지를 쓰는 액션 / 학생별 회수로 확장되는 액션 / 콘텐츠(음원)가 필요한 액션
  var PAGE_ACTIONS = { textbook_read: 1, textbook_listen: 1, coursebook: 1, write: 1 };
  var COUNT_FIELD = { voca_record: 'voca_count', article_read: 'read_count', pattern_read: 'pattern_count' };
  var CONTENT_ACTIONS = {
    article_read: 1, article_translate: 1, article_pattern: 1, article_word: 1,
    article_read_all: 1, preview_listen: 1, preview_read: 1
  };
  var LABELS = {
    textbook_read: '교재 읽기', textbook_listen: '교재 듣기', coursebook: '코스북',
    grammar_word_record: '단어장 녹음', pattern_read: '패턴 읽기', voca_record: 'Voca 암송',
    article_read: '기사 본문 읽기', article_translate: '기사 해석 읽기', article_pattern: '기사 패턴 읽기',
    article_word: '기사 단어 듣기', article_read_all: '기사 전체 읽기',
    preview_listen: '예습 듣기', preview_read: '예습 읽기', write: '쓰기', extra: '자유 항목'
  };

  function open(sess) {
    token = sess.token;
    App.show('screen-assign');
    groupId = null; plan = null; rows = [];
    $('asg-plan-sec').classList.add('hidden');
    $('asg-due-sec').classList.add('hidden');
    $('asg-groups').innerHTML = '<div class="asg-hint">불러오는 중...</div>';
    $('asg-day').innerHTML = '';
    msg('');
    Server.call('getAssignBootstrap', [token, null, null], function (res) {
      if (!res.ok) {
        if (res.needLogin) { App.logout(); return; }
        $('asg-groups').innerHTML = '<div class="asg-hint">불러오지 못했어요. 다시 로그인해주세요.</div>';
        return;
      }
      boot = res;
      weekday = res.weekday;
      renderGroups();
      renderDays();
      updateSummary();
    });
  }

  function renderGroups() {
    var box = $('asg-groups');
    box.innerHTML = '';
    boot.groups.forEach(function (g) {
      var b = document.createElement('button');
      b.className = 'asg-chip' + (g.group_id === groupId ? ' on' : '');
      b.innerHTML = '';
      b.appendChild(document.createTextNode(g.group_name));
      var s = document.createElement('small');
      s.textContent = (g.level || '레벨 미정') + ' · ' + g.student_count + '명';
      b.appendChild(s);
      b.onclick = function () { selectGroup(g.group_id); };
      box.appendChild(b);
    });
  }

  function renderDays() {
    var box = $('asg-day');
    box.innerHTML = '';
    var today = boot.weekday;
    // 반을 고른 뒤에는 그 레벨이 숙제를 갖는 요일만 진하게 — 주말에 Phonics를 골라
    // "왜 배부가 안 되지" 하는 일을 없앤다
    var has = (plan && plan.available_days) ? plan.available_days : null;
    ['월', '화', '수', '목', '금', '토', '일'].forEach(function (d) {
      var b = document.createElement('button');
      var none = has && has.indexOf(d) < 0;
      b.className = 'asg-day' + (d === weekday ? ' on' : '') + (d === today ? ' today' : '') + (none ? ' none' : '');
      b.textContent = d;
      if (none) b.title = '이 반은 ' + d + '요일 숙제가 없어요';
      b.onclick = function () { weekday = d; renderDays(); if (groupId) loadPlan(); };
      box.appendChild(b);
    });
  }

  function selectGroup(gid) {
    groupId = gid;
    renderGroups();
    loadPlan();
  }

  /** @param keepMsg 배부 직후 재조회처럼 안내 문구를 지우면 안 될 때 true */
  function loadPlan(keepMsg) {
    $('asg-plan-sec').classList.remove('hidden');
    $('asg-plan').innerHTML = '<div class="asg-hint">불러오는 중...</div>';
    $('asg-plan-sub').textContent = '';
    if (!keepMsg) msg('');
    Server.call('getAssignBootstrap', [token, groupId, weekday], function (res) {
      if (!res.ok) {
        if (res.needLogin) { App.logout(); return; }
        $('asg-plan').innerHTML = '<div class="asg-hint">' + (res.message || '불러오지 못했어요.') + '</div>';
        return;
      }
      plan = res;
      renderDays();   // available_days가 와야 숙제 없는 요일을 흐리게 칠할 수 있다
      buildRows();
      renderPlan();
      $('asg-due-sec').classList.remove('hidden');
      $('asg-due-date').value = dateForWeekday(weekday);
      updateSummary();
    });
  }

  /** 선택한 요일에 해당하는 가장 가까운 날짜(오늘 포함, 미래 방향) — 마감일 기본값 */
  function dateForWeekday(w) {
    var t = new Date();
    var want = DAYS.indexOf(w);
    var diff = (want - t.getDay() + 7) % 7;
    t.setDate(t.getDate() + diff);
    return t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0');
  }

  /**
   * 커리큘럼 → 화면 행 목록.
   * 교재 행은 SB/WB를 한 행에 묶는다(청실홍실 — 교재는 한 권, 페이지만 따로).
   * 교재 자체는 여기서 고르지 않는다. 원생 관리에서 정한 반 교재를 그대로 쓴다.
   */
  function buildRows() {
    rows = [];
    (plan.curriculum || []).forEach(function (c) {
      c.actions.forEach(function (action) {
        if (PAGE_ACTIONS[action]) {
          var types = (c.default_books && c.default_books.length) ? c.default_books : ['SB'];
          var vols = {};
          types.forEach(function (bt) {
            var pr = (plan.progress || {})[c.subject + '|' + bt] || {};
            var start = pr.next_page || 1;
            vols[bt] = {
              book_type: bt,
              // 반 설정(원생 관리)에서 정한 교재만 쓴다. 없으면 비워두고 배부를 막는다 —
              // 목록의 첫 교재를 조용히 집어넣으면 Lv3 반에 30-1이 나가는 사고가 난다.
              book_id: pr.book_id || '',
              page_start: start, page_end: start,
              prev_page: pr.current_page || 0
            };
          });
          rows.push({ on: true, action: action, subject: c.subject, vols: vols, types: types });
        } else {
          rows.push({
            on: true, action: action, subject: c.subject,
            count_field: COUNT_FIELD[action] || '',
            content_unit_id: '', required_listens: action === 'article_word' ? 1 : 0
          });
        }
      });
    });
    var sub = (plan.curriculum || []).map(function (c) { return c.subject; }).join(' · ');
    $('asg-plan-sub').textContent = plan.group ? ('· ' + weekday + '요일 · ' + sub) : '';
  }

  /** 카드 제목: 과목을 앞에 붙이되, 라벨이 이미 과목으로 시작하면 중복시키지 않는다("기사 기사 읽기" 방지) */
  function rowTitle(row) {
    var label = LABELS[row.action] || row.action;
    var subj = row.subject || '';
    if (!subj || label.indexOf(subj) === 0) return label;
    return subj + ' ' + label;
  }

  /** 이 반 레벨이 숙제를 갖는 요일(서버가 커리큘럼에서 계산해 내려줌) */
  function curriculumDays() {
    return (plan && plan.available_days) ? plan.available_days.filter(function (d) { return d !== weekday; }) : [];
  }

  function bookTitle(bookId) {
    var b = (plan.textbooks || []).filter(function (t) { return t.book_id === bookId; })[0];
    if (!b) return '';
    // 라벨에 시리즈명이 이미 들어간 교재가 있어 중복 표기를 막는다("Grammar ELT Grammar ELT 1")
    var series = String(b.series || '').trim(), label = String(b.label || '').trim();
    if (!series) return label;
    return label.indexOf(series) === 0 ? label : (series + ' ' + label);
  }

  function renderPlan() {
    var box = $('asg-plan');
    box.innerHTML = '';
    if (!rows.length) {
      // 커리큘럼이 비는 건 흔한 정상 상황이다(Phonics·Lv0은 월~금만 있어 주말이 빔).
      // "없다"만 말하지 말고 뭘 하면 되는지까지 알려준다.
      var lv = (plan.group && plan.group.level) || '이 반';
      var days = curriculumDays();
      var box2 = document.createElement('div');
      box2.className = 'asg-hint';
      box2.innerHTML = '<b>' + weekday + '요일은 ' + lv + ' 커리큘럼이 없어요.</b><br>' +
        (days.length
          ? '이 반은 <b>' + days.join('·') + '요일</b>에 숙제가 있어요. 위에서 요일을 바꿔보세요.<br>' +
            '<span style="color:var(--muted)">(요일 탭은 “무슨 숙제를 낼지”만 정해요. 마감일은 아래에서 따로 고릅니다)</span>'
          : 'Curriculum 시트에 이 레벨의 요일이 없어요.') +
        '<br><br>그날만 특별히 낼 게 있으면 아래 <b>＋ 자유 항목 추가</b>로 배부할 수 있어요.';
      box.appendChild(box2);
      return;
    }
    rows.forEach(function (row, i) { box.appendChild(renderRow(row, i)); });
  }

  function renderRow(row, i) {
    var card = document.createElement('div');
    card.className = 'asg-card' + (row.on ? '' : ' off');

    var head = document.createElement('div');
    head.className = 'asg-card-h';
    var cb = document.createElement('input');
    cb.type = 'checkbox'; cb.checked = row.on;
    cb.onchange = function () { row.on = cb.checked; renderPlan(); updateSummary(); };
    var t = document.createElement('div');
    t.className = 'asg-card-t';
    t.textContent = row.custom_label || rowTitle(row);
    head.appendChild(cb); head.appendChild(t);

    if (row.vols) {
      var tag = document.createElement('span');
      tag.className = 'asg-card-tag'; tag.textContent = (row.types || []).join('·');
      head.appendChild(tag);
    }
    if (row.custom) {
      var del = document.createElement('button');
      del.className = 'asg-del'; del.textContent = '✕'; del.title = '삭제';
      del.onclick = function () { rows.splice(i, 1); renderPlan(); updateSummary(); };
      head.appendChild(del);
    }
    card.appendChild(head);

    var body = document.createElement('div');
    body.className = 'asg-card-b';

    // 1) 교재 행: 교재는 글자로만(원생 관리에서 정함), SB/WB 각각 페이지 다이얼
    if (row.vols) {
      var anyBook = row.types.map(function (bt) { return row.vols[bt].book_id; }).filter(Boolean)[0];
      var name = document.createElement('div');
      name.className = 'asg-bookname';
      name.textContent = anyBook ? bookTitle(anyBook) : (row.subject + ' 교재가 지정되지 않았어요');
      if (!anyBook) name.style.color = 'var(--danger)';
      body.appendChild(name);
      if (!anyBook) {
        var go = document.createElement('div');
        go.className = 'asg-auto';
        go.textContent = '원생 관리 → 과목별 교재에서 먼저 정해주세요.';
        body.appendChild(go);
      }
      row.types.forEach(function (bt) {
        var v = row.vols[bt];
        body.appendChild(pageDial(row, v, 'page_start', bt + ' 시작'));
        body.appendChild(pageDial(row, v, 'page_end', bt + ' 끝'));
        if (v.prev_page) {
          var p = document.createElement('div');
          p.className = 'asg-auto';
          p.innerHTML = bt + ' 지난 진도 <b>' + v.prev_page + '쪽</b>까지 — 이어서 시작해요.';
          body.appendChild(p);
        }
      });
    }

    // 2) 콘텐츠(음원)가 필요한 행: 어떤 기사/콘텐츠인지 선택
    if (CONTENT_ACTIONS[row.action] && !row.custom) {
      body.appendChild(contentSelect(row));
    }

    // 3) 학생별 회수로 늘어나는 행: 여기서 묻지 않고 안내만
    if (row.count_field) {
      var a = document.createElement('div');
      a.className = 'asg-auto';
      a.innerHTML = '학생별 회수 자동 — ' + countSummary(row.count_field);
      body.appendChild(a);
    }

    // 4) 자유 항목: 라벨 직접 입력
    if (row.custom) {
      var inp = document.createElement('input');
      inp.className = 'asg-book'; inp.placeholder = '예: 프린트 3장 풀기';
      inp.value = row.custom_label || '';
      inp.oninput = function () { row.custom_label = inp.value; t.textContent = inp.value || '자유 항목'; updateSummary(); };
      body.appendChild(inp);
    }

    card.appendChild(body);
    return card;
  }

  function contentSelect(row) {
    var sel = document.createElement('select');
    sel.className = 'asg-book';
    var units = [];
    (plan.contents || []).forEach(function (c) {
      // 기사 번호 x-x를 앞에 붙인다(앞자리=레벨, 뒷자리=그 주 순번)
      var prefix = c.code ? (c.code + ' ') : '';
      c.units.forEach(function (u) {
        units.push({ id: u.content_unit_id, label: prefix + c.title + ' · ' + u.unit_label });
      });
    });
    if (!units.length) {
      var o = document.createElement('option');
      o.textContent = '등록된 콘텐츠가 없어요 (시트에 기사 추가 필요)';
      sel.appendChild(o); sel.disabled = true;
      return sel;
    }
    var none = document.createElement('option');
    none.value = ''; none.textContent = '— 콘텐츠 선택 —';
    sel.appendChild(none);
    units.forEach(function (u) {
      var o = document.createElement('option');
      o.value = u.id; o.textContent = u.label;
      if (u.id === row.content_unit_id) o.selected = true;
      sel.appendChild(o);
    });
    sel.onchange = function () { row.content_unit_id = sel.value; updateSummary(); };
    return sel;
  }

  /** 페이지 가로 다이얼 — 진도 이어받기(시작값=next_page). 페이지=가로, 검증된 프로토타입 방식 */
  function pageDial(row, vol, field, label) {
    var wrap = document.createElement('div');
    var head = document.createElement('div');
    head.className = 'asg-dial-l';
    var name = document.createElement('span'); name.textContent = label + '쪽';
    var val = document.createElement('b'); val.textContent = vol[field] + '쪽';
    head.appendChild(name); head.appendChild(val);
    wrap.appendChild(head);

    var strip = document.createElement('div');
    strip.className = 'asg-dial';
    var book = (plan.textbooks || []).filter(function (t) { return t.book_id === vol.book_id; })[0];
    var max = (book && book.total_pages) ? book.total_pages : 80;
    var from = Math.max(1, (vol.prev_page || 0) - 2);
    for (var p = from; p <= max; p++) {
      strip.appendChild(dialBtn(vol, field, p, strip, val));
    }
    wrap.appendChild(strip);
    // 선택값이 보이도록 스크롤
    setTimeout(function () {
      var on = strip.querySelector('button.on');
      if (on && on.scrollIntoView) on.scrollIntoView({ block: 'nearest', inline: 'center' });
    }, 30);
    return wrap;
  }

  function dialBtn(vol, field, p, strip, valEl) {
    var b = document.createElement('button');
    b.textContent = p;
    b.className = p === vol[field] ? 'on'
      : (p > vol.page_start && p < vol.page_end ? 'between' : '');
    b.onclick = function () {
      vol[field] = p;
      // 끝쪽이 시작쪽보다 앞이면 같이 밀어준다(잘못된 범위 방지)
      if (field === 'page_start' && vol.page_end < p) vol.page_end = p;
      if (field === 'page_end' && p < vol.page_start) vol.page_start = p;
      valEl.textContent = p + '쪽';
      renderPlan(); updateSummary();
    };
    return b;
  }

  function countSummary(field) {
    var counts = {};
    (plan.students || []).forEach(function (s) {
      var n = s[field] || 0;
      counts[n] = (counts[n] || 0) + 1;
    });
    return Object.keys(counts).sort().map(function (n) {
      return n + '회 ' + counts[n] + '명';
    }).join(' · ');
  }

  function addCustom() {
    if (!plan) { msg('반을 먼저 선택해주세요.', true); return; }
    rows.push({ on: true, custom: true, action: 'extra', subject: '', custom_label: '' });
    renderPlan(); updateSummary();
  }

  /** 화면 행 → 서버 payload items */
  function collectItems() {
    var items = [];
    rows.forEach(function (row) {
      if (!row.on) return;
      if (row.custom && !String(row.custom_label || '').trim()) return; // 라벨 없는 자유 항목은 제외
      var subject = row.subject || (plan.curriculum[0] || {}).subject || '';

      // 교재 행은 SB/WB가 한 카드에 묶여 있지만, 서버로는 권마다 한 항목씩 보낸다
      // (진도가 SB·WB 따로 나가므로 Progress도 각각 갱신돼야 한다)
      if (row.vols) {
        row.types.forEach(function (bt) {
          var v = row.vols[bt];
          if (!v.book_id) return; // 교재 미지정이면 보내지 않음
          items.push({
            action: row.action, subject: subject,
            book_type: bt, book_id: v.book_id,
            page_start: v.page_start, page_end: v.page_end
          });
        });
        return;
      }

      var it = { action: row.action, subject: subject };
      if (row.count_field) it.count_field = row.count_field;
      if (row.content_unit_id) it.content_unit_id = row.content_unit_id;
      if (row.required_listens) it.required_listens = row.required_listens;
      if (row.custom) it.custom_label = String(row.custom_label).trim();
      items.push(it);
    });
    return items;
  }

  /** 학생별 회수를 반영한 실제 생성 건수(서버 확장 결과와 같아야 함) */
  function estimate(items) {
    var students = plan ? (plan.students || []) : [];
    var total = 0, per = [];
    students.forEach(function (s) {
      var n = 0;
      items.forEach(function (it) {
        n += it.count_field ? (s[it.count_field] || 0) : 1;
      });
      if (n > 0) { total += n; per.push(s.name + ' ' + n + '건'); }
    });
    return { students: per.length, items: total, detail: per.join(' · ') };
  }

  function updateSummary() {
    var el = $('asg-summary');
    var btn = $('asg-submit');
    if (!plan || !groupId) {
      el.textContent = '반을 선택하면 그날 숙제가 자동으로 표시돼요.';
      el.classList.remove('ready'); btn.disabled = true;
      return;
    }
    var items = collectItems();
    var est = estimate(items);
    if (!items.length || !est.items) {
      // 항목은 켜져 있는데 교재가 없어서 0건이 되는 경우가 흔하다. 진짜 이유를 말해준다.
      var needBook = rows.filter(function (r) {
        return r.on && r.vols && r.types.every(function (bt) { return !r.vols[bt].book_id; });
      });
      if (needBook.length) {
        var subj = needBook.map(function (r) { return r.subject; }).filter(function (v, i, a) { return a.indexOf(v) === i; });
        el.innerHTML = '<b>' + subj.join('·') + ' 교재가 지정되지 않았어요.</b><br>' +
          '<span style="font-size:12px">원생 관리 → 과목별 교재에서 정한 뒤 다시 오세요.</span>';
        el.classList.remove('ready'); btn.disabled = true;
        return;
      }
      el.textContent = '배부할 항목을 하나 이상 켜주세요.';
      el.classList.remove('ready'); btn.disabled = true;
      return;
    }
    el.innerHTML = '<b>' + est.students + '명</b>에게 총 <b>' + est.items + '건</b><br>' +
      '<span style="font-size:12px">' + est.detail + '</span>';
    el.classList.add('ready');
    btn.disabled = false;
  }

  function submit() {
    if (!plan || !groupId) { msg('반을 선택해주세요.', true); return; }
    var items = collectItems();
    if (!items.length) { msg('배부할 항목을 하나 이상 켜주세요.', true); return; }
    var dueDate = $('asg-due-date').value;
    if (!dueDate) { msg('마감일을 선택해주세요.', true); return; }

    // 콘텐츠가 필요한데 안 고른 항목이 있으면 막는다(음원 없는 숙제 방지)
    var missing = items.filter(function (it) { return CONTENT_ACTIONS[it.action] && !it.content_unit_id; });
    if (missing.length) {
      msg('"' + (LABELS[missing[0].action] || missing[0].action) + '"의 콘텐츠를 선택해주세요.', true);
      return;
    }

    var est = estimate(items);
    var g = boot.groups.filter(function (x) { return x.group_id === groupId; })[0] || {};
    if (!confirm(g.group_name + ' ' + est.students + '명에게 ' + weekday + '요일 숙제 ' +
      est.items + '건을 배부할까요?\n(마감 ' + dueDate + ')')) return;

    var payload = {
      groupId: groupId,
      dueDate: dueDate,
      dueTime: $('asg-due-time').value || '21:00',
      weekday: weekday,
      subject: (plan.curriculum[0] || {}).subject || '숙제',
      items: items
    };
    var btn = $('asg-submit');
    btn.disabled = true; msg('배부 중...', false);
    Server.call('createAssignments', [token, payload], function (res) {
      btn.disabled = false;
      if (!res.ok) {
        if (res.needLogin) { App.logout(); return; }
        msg(res.message || '배부하지 못했어요. 다시 해보세요.', true);
        return;
      }
      msg(res.students + '명에게 ' + res.items + '건 배부 완료! 진도도 갱신됐어요.', false);
      loadPlan(true); // 갱신된 진도로 다시 그린다(다음 배부는 이어받은 페이지부터). 안내 문구는 유지
    });
  }

  function msg(text, isErr) {
    var el = $('asg-msg');
    el.textContent = text || '';
    el.style.color = isErr ? 'var(--danger)' : 'var(--muted)';
  }

  return { open: open, addCustom: addCustom, updateSummary: updateSummary, submit: submit };
})();

/**
 * MyPage — 학생 마이페이지 (WBS 3.7)
 * 오늘의 숙제 화면은 "오늘 받은 포인트"만 보여준다. 여기서는 포인트 전체 내역·등급·

 * (배지 지급 코드 자체가 아직 없어 기준이 정해지기 전까지는 빈 화면이 된다).
 */
var MyPage = (function () {
  function $(id) { return document.getElementById(id); }

  function open(s) {
    sess = s;
    App.show('screen-mypage');

        if (res.needLogin) { localStorage.removeItem('cambridge_session'); location.reload(); return; }
        $('mp-history').innerHTML = '<div class="asg-hint">' + (res.message || '불러오지 못했어요.') + '</div>';
        return;
      }
      render(res);
    });
  }

  function render(d) {
    $('mp-group').textContent = d.group_name + (d.level ? ' · ' + d.level : '');
    $('mp-name').textContent = d.name + ' 님';
    $('mp-point').textContent = d.points.total + 'P';

    $('mp-tier-need').textContent = d.tier.next ? d.tier.next + '까지 ' + d.tier.need + 'P' : '최고 등급!';
    $('mp-tier-fill').style.width = '0%';
    var mpTierPct = Math.round(Math.min(1, Math.max(0, d.tier.progress)) * 100) + '%';
    requestAnimationFrame(function () { requestAnimationFrame(function () { $('mp-tier-fill').style.width = mpTierPct; }); });

    var box = $('mp-history');
    box.innerHTML = '';
    var hist = d.points.history || [];
    if (!hist.length) {
      box.innerHTML = '<div class="mp-empty">아직 받은 포인트가 없어요. 오늘의 숙제부터 시작해봐요!</div>';

    hist.forEach(function (h) {

      row.className = 'mp-hist-row';
      var left = document.createElement('div');

      var date = document.createElement('div');
      date.className = 'mp-hist-date'; date.textContent = String(h.awarded_at || '').slice(0, 16);
      left.appendChild(lab); left.appendChild(date);
      var amt = document.createElement('div');
      amt.className = 'mp-hist-amt'; amt.textContent = (h.amount > 0 ? '+' : '') + h.amount + 'P';
      row.appendChild(left); row.appendChild(amt);
      box.appendChild(row);
    });
  }

  function close() { App.backToDash(sess); }

  return { open: open, close: close };
})();

      var label = document.createElement('div');
      label.className = 'hw-label';
      label.textContent = c.label + (c.seq ? ' (' + c.seq + ')' : '');
      var metaRow = document.createElement('div');
      metaRow.className = 'hw-meta';
      if (c.overdue) {
        var od = document.createElement('span');
        od.className = 'overdue';
        od.textContent = '마감 지남 · ';
        metaRow.appendChild(od);
      }
      metaRow.appendChild(document.createTextNode('마감 ' + (c.due_time || '21:00')));
      main.appendChild(subj); main.appendChild(label); main.appendChild(metaRow);
      var st = document.createElement('div');
      st.className = 'hw-status';
      st.textContent = STATUS_LABEL[c.status] || c.status;
      card.appendChild(icon); card.appendChild(main); card.appendChild(st);
      card.onclick = function () { openItem(c); };
      wrap.appendChild(card);
    });
    show('screen-dash');
  }

  function openItem(c) {
    if (c.status === '제출완료' || c.status === '면제') return;
    if (c.action_type === 'listen') { openListen(c); return; }
    // write = 사진 제출(QnA 손글씨·파닉스 쓰기)도 같은 화면을 쓴다 — 촬영/미리보기/제출
    if (c.action_type === 'record' || c.action_type === 'read' || c.action_type === 'write') {
      openRecord(c); return;
    }
    var meta = ACTION_META[c.action_type] || ACTION_META.listen;
    alert(meta.label + ' 화면은 다음 업데이트에서 열려요!\n(' + c.label + ')');
  }

  // ===== S-03 녹음·제출 =====
  var Rec = { item: null, blob: null, mimeType: '', timer: null, state: 'idle', photoPreviewFailed: false }; // idle | recording | preview | uploading | done

  /**
   * 제출 화면 상태 전환. 녹음(audio)과 사진(photo) 두 모드를 같은 화면에서 쓴다.
   * 사진 모드는 타이머·녹음중 단계가 없고 idle → preview → uploading 으로 간다.
   */
  function rcSetState(state) {
    Rec.state = state;
    var photo = Rec.mode === 'photo';
    var main = $('rc-main');
    var label = $('rc-state-label');
    $('rc-preview').classList.toggle('hidden', photo || state !== 'preview');
    $('rc-photo').classList.toggle('hidden', !photo || state !== 'preview' || Rec.photoPreviewFailed);
    $('rc-timer').classList.toggle('hidden', photo);
    $('rc-again').classList.toggle('hidden', state !== 'preview');
    $('rc-again').textContent = photo ? '다시 찍기' : '다시 녹음하기';
    $('rc-stage').classList.toggle('hidden', state === 'done');
    $('rc-done').classList.toggle('hidden', state !== 'done');
    if (state === 'idle') {
      main.className = 'rc-main-btn rec' + (photo ? ' photo' : '');
      main.innerHTML = photo ? '사진 촬영하기' : ICONS.record;
      main.setAttribute('aria-label', photo ? '사진 촬영하기' : '녹음 시작');
      main.disabled = false;
      label.textContent = photo
        ? '답을 쓴 공책이 잘 보이게 찍어주세요'
        : '녹음 버튼을 누르고 또박또박 읽어주세요';
      $('rc-timer').textContent = '0:00';
    } else if (state === 'recording') {
      main.className = 'rc-main-btn stop';
      main.textContent = '그만 녹음하기';
      main.disabled = false;
      label.innerHTML = '<span class="rc-dot"></span>녹음 중...';
    } else if (state === 'preview') {
      main.className = 'rc-main-btn submit';
      main.textContent = '선생님께 제출하기';
      main.disabled = false;
      label.textContent = !photo ? '들어보고 마음에 들면 제출해요'
        : (Rec.photoPreviewFailed ? '이 사진은 여기서 미리보기만 안 될 뿐, 제출은 정상적으로 돼요' : '글씨가 잘 보이면 제출해요');
    } else if (state === 'uploading') {
      main.className = 'rc-main-btn submit';
      main.textContent = '보내는 중...';
      main.disabled = true;
      label.textContent = '조금만 기다려주세요';
    }
  }

  function rcStartTimer() {
    var t0 = Date.now();
    Rec.timer = setInterval(function () {
      $('rc-timer').textContent = fmtTime((Date.now() - t0) / 1000);
    }, 250);
  }
  function rcStopTimer() { if (Rec.timer) { clearInterval(Rec.timer); Rec.timer = null; } }

  function openRecord(c) {
    // 세션이 없으면(만료·캐시 삭제) 아래에서 loadSession().token 접근이 예외를 던져
    // 화면만 뜨고 버튼이 전부 죽은 상태가 된다. 로그인으로 돌려보낸다.
    var sess0 = loadSession();
    if (!sess0 || !sess0.token) { localStorage.removeItem(SESSION_KEY); loadBootstrap(); return; }
    Rec.item = c;
    Rec.blob = null;
    Rec.photoPreviewFailed = false;
    // write = 사진 제출(QnA 손글씨 답안, 파닉스 쓰기). 나머지는 녹음.
    Rec.mode = (c.action_type === 'write') ? 'photo' : 'audio';
    $('rc-subject').textContent = c.subject + ' · ' + (ACTION_META[c.action_type] || ACTION_META.record).label;
    $('rc-title').textContent = c.label + (c.seq ? ' (' + c.seq + ')' : '');
    $('rc-due').textContent = '마감 ' + (c.due_time || '21:00') + (c.overdue ? ' · 마감 지남' : '');
    $('rc-msg').textContent = '';
    $('rc-msg').className = 'ls-msg';
    $('rc-awards-box').classList.add('hidden');
    rcSetState('idle');
    show('screen-record');

    // 읽을 본문 표시 — 학생이 보면서 읽도록 (getListenData 재사용, 음원은 안 가져옴)
    var tr = $('rc-transcript');
    tr.classList.add('hidden');
    Server.call('getListenData', [loadSession().token, c.item_id], function (res) {
      if (res.ok && res.transcript && Rec.item && Rec.item.item_id === c.item_id) {
        tr.textContent = res.transcript;
        tr.classList.remove('hidden');
      }
    }, function () { /* 본문 표시는 부가 기능 — 실패해도 녹음은 진행 */ });

    $('rc-back').onclick = function () {
      if (Rec.state === 'recording') {
        if (!confirm('녹음 중이에요. 나가면 지금 녹음은 사라져요. 나갈까요?')) return;
        Recorder.cancel();
        rcStopTimer();
      }
      loadDashboard(loadSession());
    };
    $('rc-done-back').onclick = function () { loadDashboard(loadSession()); };
    $('rc-again').onclick = function () {
      Rec.blob = null;
      Rec.photoPreviewFailed = false;
      $('rc-preview').src = '';
      $('rc-photo').src = '';
      $('rc-file').value = '';   // 같은 파일을 다시 골라도 change가 뜨도록 비운다
      rcSetState('idle');
    };
    $('rc-main').onclick = rcMainAction;

    // 사진 선택 → 미리보기. 촬영·갤러리 모두 여기로 들어온다.
    $('rc-file').onchange = function () {
      var f = this.files && this.files[0];
      if (!f) return;
      if (f.size > 12 * 1024 * 1024) {
        $('rc-msg').textContent = '사진이 너무 커요(12MB 넘음). 다시 찍어주세요.';
        $('rc-msg').className = 'ls-msg bad';
        this.value = '';
        return;
      }
      usePhoto_(f);
    };
  }

  /**
   * 아이폰 카메라가 HEIC로 찍은 사진은 기기·설치형 PWA에 따라 <img> 미리보기가
   * 깨져 보이는 경우가 있다(원장 실기기 확인, 2026-08-01). createImageBitmap으로
   * 한 번 디코딩해 캔버스에 그린 뒤 JPEG로 다시 인코딩해서 미리보기·제출 모두
   * 이 결과물을 쓴다 — 포맷을 항상 확실히 지원되는 JPEG로 통일한다(음원 프록시와
   * 같은 이유: 기기·웹뷰가 못 다루는 포맷을 믿지 않고 서버/클라이언트가 직접 변환).
   * imageOrientation:'from-image'로 EXIF 회전을 반영해 그린다(안 하면 세로로 찍은
   * 사진이 캔버스를 거치면서 눕는 문제가 생긴다).
   */
  function usePhoto_(f) {
    // 성공하면 항상 JPEG로 재인코딩된 결과를 쓴다 — 미리보기와 제출 파일이 같아야
    // "미리보기엔 깨져 보이는데 실제 제출 파일은 멀쩡함" 같은 혼란이 없다.
    function apply(blob, mime) {
      Rec.blob = blob;
      Rec.mimeType = mime;
      Rec.photoPreviewFailed = false;
      $('rc-photo').src = URL.createObjectURL(blob);
      rcSetState('preview');
      $('rc-msg').textContent = '';
      $('rc-msg').className = 'ls-msg';
    }
    // 변환이 끝내 안 되면(디코딩 자체가 막히는 기기) 원본 파일 그대로 제출은 가능하게
    // 하되, 미리보기 자리에는 깨진 사진 아이콘 대신 안내 문구만 남긴다.
    // ⚠ 예전 버전은 여기서 실패한 원본 파일을 그대로 <img>에 넣었는데, 애초에
    // 그 파일이 안 열려서 실패한 거라 깨진 아이콘이 그대로 재현되는 문제가 있었다(2026-08-01).
    //
    // 🔧 임시 디버그(2026-08-01): 실기기에서 두 번의 추측성 수정이 다 안 먹혀서,
    // 원인을 실제로 보기 전까지는 실패 사유를 화면에 그대로 찍는다. 원인을 알고 나면
    // 이 디버그 문구는 지운다 — 정상 문구는 "이 사진은 여기서 미리보기만 안 될 뿐..." 한 줄뿐.
    function fail(reason) {
      Rec.blob = f;
      Rec.mimeType = f.type || 'image/jpeg';
      Rec.photoPreviewFailed = true;
      rcSetState('preview');
      $('rc-msg').textContent = '[디버그] ' + (f.type || '타입없음') + ' ' + Math.round((f.size || 0) / 1024) +
        'KB — ' + reason + ' · 제출은 원본 파일로 정상 진행돼요.';
      $('rc-msg').className = 'ls-msg';
    }
    function toJpeg(bitmap) {
      try {
        var canvas = document.createElement('canvas');
        canvas.width = bitmap.width; canvas.height = bitmap.height;
        canvas.getContext('2d').drawImage(bitmap, 0, 0);
        canvas.toBlob(function (jpegBlob) { jpegBlob ? apply(jpegBlob, 'image/jpeg') : fail('toBlob 실패'); }, 'image/jpeg', 0.85);
      } catch (eCanvas) {
        fail('캔버스 오류: ' + (eCanvas && eCanvas.message));
      }
    }
    // createImageBitmap 자체가 동기적으로 예외를 던지는 엔진도 있어 try로 감싼다
    // (그냥 .catch()만 걸면 이런 동기 예외는 못 잡고 화면이 그대로 멈춘 것처럼 보인다).
    try {
      if (!window.createImageBitmap) { fail('createImageBitmap 미지원'); return; }
      createImageBitmap(f, { imageOrientation: 'from-image' }).then(toJpeg).catch(function (e1) {
        try {
          // imageOrientation 옵션 자체를 못 받는 구형 엔진 대비 — 옵션 없이 한 번 더 시도
          createImageBitmap(f).then(toJpeg).catch(function (e2) {
            fail('디코딩 실패: ' + (e2 && e2.message || e1 && e1.message));
          });
        } catch (eRetry) {
          fail('재시도 오류: ' + (eRetry && eRetry.message));
        }
      });
    } catch (eSync) {
      fail('동기 오류: ' + (eSync && eSync.message));
    }
  }

  function rcMainAction() {
    // 사진 모드: 찍기 → 미리보기 → 제출 (녹음 단계 없음)
    if (Rec.mode === 'photo') {
      if (Rec.state === 'idle') $('rc-file').click();
      else if (Rec.state === 'preview') rcSubmit();
      return;
    }
    if (Rec.state === 'idle') {
      if (!window.Recorder || !Recorder.isSupported()) {
        $('rc-msg').textContent = '이 브라우저는 녹음을 지원하지 않아요. 크롬이나 사파리로 열어주세요.';
        $('rc-msg').className = 'ls-msg bad';
        return;
      }
      Recorder.start().then(function () {
        rcSetState('recording');
        rcStartTimer();
      }).catch(function () {
        $('rc-msg').textContent = '마이크를 사용할 수 없어요. 마이크 권한을 허용해주세요.';
        $('rc-msg').className = 'ls-msg bad';
      });
    } else if (Rec.state === 'recording') {
      rcStopTimer();
      Recorder.stop().then(function (r) {
        Rec.blob = r.blob;
        Rec.mimeType = r.mimeType;
        $('rc-preview').src = URL.createObjectURL(r.blob);
        rcSetState('preview');
      }).catch(function () {
        $('rc-msg').textContent = '녹음 저장에 실패했어요. 다시 해보세요.';
        $('rc-msg').className = 'ls-msg bad';
        rcSetState('idle');
      });
    } else if (Rec.state === 'preview') {
      rcSubmit();
    }
  }

  function rcSubmit() {
    if (!Rec.blob) return;
    rcSetState('uploading');
    var sess = loadSession();
    Recorder.blobToBase64(Rec.blob).then(function (b64) {
      Server.call('submitRecording', [sess.token, Rec.item.item_id, b64, Rec.mimeType], function (res) {
        if (!res.ok) {
          if (res.needLogin) { localStorage.removeItem(SESSION_KEY); loadBootstrap(); return; }
          $('rc-msg').textContent = res.message || '제출에 실패했어요. 다시 해보세요.';
          $('rc-msg').className = 'ls-msg bad';
          rcSetState('preview');
          return;
        }
        $('rc-done-info').textContent = res.attempt_no + '회차 제출 · ' + res.submitted_at
          + (res.flag ? ' · 확인 필요 표시됨' : '');
        var box = $('rc-awards-box');
        if (res.awards && res.awards.length) {
          box.classList.remove('hidden');
          var list = $('rc-awards-list');
          list.innerHTML = '';
          res.awards.forEach(function (a) {
            var row = document.createElement('div');
            row.className = 'aw-row';
            var name = document.createElement('span');
            name.textContent = String(a.label).replace(/\s*\+\d+\s*P?\s*$/, '');
            var amt = document.createElement('b');
            amt.textContent = '+' + a.amount + 'P';
            row.appendChild(name); row.appendChild(amt);
            list.appendChild(row);
          });
        } else {
          box.classList.add('hidden');
        }
        rcSetState('done');
      }, function () {
        $('rc-msg').textContent = '연결이 불안정해요. 인터넷을 확인하고 다시 제출해주세요.';
        $('rc-msg').className = 'ls-msg bad';
        rcSetState('preview');
      });
    });
  }

  // ===== S-02 듣기 학습 =====
  var Listen = { audio: null, itemId: null, sessionStart: null, maxReached: 0, skipped: false, playing: false, finished: false };

  function fmtTime(sec) {
    if (!isFinite(sec) || sec < 0) return '-:--';
    var m = Math.floor(sec / 60), s = Math.floor(sec % 60);
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  function openListen(c) {
    show('screen-loading');
    var sess = loadSession();
    // 세션 없으면 sess.token에서 예외가 나 로딩 화면에 갇힌다 — 로그인으로 돌려보낸다
    if (!sess || !sess.token) { localStorage.removeItem(SESSION_KEY); loadBootstrap(); return; }
    Server.call('getListenData', [sess.token, c.item_id], function (res) {
      if (!res.ok) {
        if (res.needLogin) { localStorage.removeItem(SESSION_KEY); loadBootstrap(); return; }
        alert(res.message || '불러오지 못했어요.');
        loadDashboard(sess);
        return;
      }
      setupListen(res);
    });
  }

  function setupListen(d) {
    Listen.itemId = d.item_id;
    Listen.sessionStart = null;
    Listen.maxReached = 0;
    Listen.skipped = false;
    Listen.playing = false;
    Listen.finished = false;

    $('ls-subject').textContent = d.subject;
    $('ls-title').textContent = d.label;
    $('ls-count').textContent = d.valid_count;
    $('ls-required').textContent = d.required;
    var tr = $('ls-transcript');
    if (d.transcript) { tr.textContent = d.transcript; tr.classList.remove('empty'); }
    else { tr.textContent = '음원을 들으며 따라 읽어보세요'; tr.classList.add('empty'); }
    $('ls-msg').textContent = '';
    $('ls-msg').className = 'ls-msg';
    $('ls-fill').style.width = '0%';
    $('ls-cur').textContent = '0:00';
    $('ls-dur').textContent = '-:--';
    $('ls-play').innerHTML = '&#9654;&#xFE0E;';
    $('ls-play').disabled = false;

    if (Listen.audio) { Listen.audio.pause(); Listen.audio.src = ''; }
    var audio = new Audio();
    audio.preload = 'metadata';
    Listen.audio = audio;

    // 음원 로드: mock은 audio_url(blob), 실서버는 GAS 프록시(base64→blob)
    // 드라이브 직링크는 <audio>에서 재생이 막혀 프록시 방식 사용 (2026-07-19)
    if (d.audio_url) {
      audio.src = d.audio_url;
    } else if (d.has_audio) {
      $('ls-msg').textContent = '음원 불러오는 중...';
      $('ls-msg').className = 'ls-msg';
      $('ls-play').disabled = true;
      var sess0 = loadSession();
      Server.call('getAudioForUnit', [sess0.token, d.content_unit_id], function (res) {
        if (!res.ok) {
          $('ls-msg').textContent = res.message || '음원을 불러올 수 없어요. 선생님께 알려주세요.';
          $('ls-msg').className = 'ls-msg bad';
          return;
        }
        var bin = atob(res.base64);
        var u8 = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
        audio.src = URL.createObjectURL(new Blob([u8], { type: res.mimeType || 'audio/mpeg' }));
        $('ls-msg').textContent = '';
        $('ls-play').disabled = false;
      }, function () {
        $('ls-msg').textContent = '연결이 불안정해요. 뒤로 갔다가 다시 들어와주세요.';
        $('ls-msg').className = 'ls-msg bad';
      });
    } else {
      $('ls-msg').textContent = '음원이 아직 등록되지 않았어요. 선생님께 알려주세요.';
      $('ls-msg').className = 'ls-msg bad';
      $('ls-play').disabled = true;
    }

    // OS 미디어 컨트롤의 탐색 버튼 미등록 (설계결정문서 5.3 — MediaSession seek 핸들러 등록 안 함)
    if ('mediaSession' in navigator) {
      ['seekbackward', 'seekforward', 'seekto'].forEach(function (a) {
        try { navigator.mediaSession.setActionHandler(a, null); } catch (e) {}
      });
    }

    audio.addEventListener('loadedmetadata', function () { $('ls-dur').textContent = fmtTime(audio.duration); });
    audio.addEventListener('timeupdate', function () {
      if (audio.currentTime > Listen.maxReached) Listen.maxReached = audio.currentTime;
      if (audio.duration) $('ls-fill').style.width = Math.min(100, audio.currentTime / audio.duration * 100) + '%';
      $('ls-cur').textContent = fmtTime(audio.currentTime);
    });
    // UI 차단을 우회한 앞으로 건너뛰기 감지 (2차 안전장치). 되감기는 허용
    audio.addEventListener('seeking', function () {
      if (audio.currentTime > Listen.maxReached + 1.0) Listen.skipped = true;
    });
    audio.addEventListener('ended', function () { onListenEnded(); });
    audio.addEventListener('error', function () {
      $('ls-msg').textContent = '음원을 불러올 수 없어요. 선생님께 알려주세요.';
      $('ls-msg').className = 'ls-msg bad';
      $('ls-play').disabled = true;
    });

    $('ls-play').onclick = function () {
      if (Listen.playing) {
        audio.pause();
        Listen.playing = false;
        $('ls-play').innerHTML = '&#9654;&#xFE0E;';
      } else {
        if (!Listen.sessionStart) Listen.sessionStart = new Date();
        audio.play();
        Listen.playing = true;
        $('ls-play').innerHTML = '&#9208;&#xFE0E;';
        $('ls-msg').textContent = '';
        $('ls-msg').className = 'ls-msg';
      }
    };
    $('ls-restart').onclick = function () {
      // 처음부터 = 새 세션 시작 (되감기 허용, 이전 진행은 기록하지 않음)
      audio.currentTime = 0;
      Listen.maxReached = 0;
      Listen.skipped = false;
      Listen.sessionStart = new Date();
      if (!Listen.playing) { audio.play(); Listen.playing = true; $('ls-play').innerHTML = '&#9208;&#xFE0E;'; }
    };
    show('screen-listen');
  }

  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function tsStr(d) {
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) + ' ' +
      pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds());
  }

  function onListenEnded() {
    Listen.playing = false;
    Listen.finished = true;
    $('ls-play').innerHTML = '&#9654;&#xFE0E;';
    $('ls-msg').textContent = '기록 중...';
    var sess = loadSession();
    var started = Listen.sessionStart ? tsStr(Listen.sessionStart) : tsStr(new Date());
    Server.call('recordListenSession', [sess.token, Listen.itemId, started, true, Listen.skipped], function (res) {
      if (!res.ok) {
        $('ls-msg').textContent = res.message || '기록에 실패했어요. 한 번 더 들어주세요.';
        $('ls-msg').className = 'ls-msg bad';
        return;
      }
      $('ls-count').textContent = res.valid_count;
      $('ls-required').textContent = res.required;
      if (res.just_completed) {
        var earned = (res.awards || []).reduce(function (sum, a) { return sum + a.amount; }, 0);
        $('ls-msg').textContent = '유효 듣기 달성!' + (earned ? ' +' + earned + 'P' : '') + ' 오늘의 숙제로 돌아가요';
        $('ls-msg').className = 'ls-msg good';
        setTimeout(function () { loadDashboard(sess); }, 1800);
      } else if (Listen.skipped) {
        $('ls-msg').textContent = '건너뛰기가 감지돼 이번 회차는 인정되지 않았어요. 처음부터 다시!';
        $('ls-msg').className = 'ls-msg bad';
        Listen.skipped = false;
        Listen.maxReached = 0;
        Listen.sessionStart = null;
      } else {
        $('ls-msg').textContent = '유효 듣기 1회 완료! (' + res.valid_count + '/' + res.required + ')';
        $('ls-msg').className = 'ls-msg good';
        Listen.sessionStart = null;
        Listen.maxReached = 0;
      }
    });
  }

  function closeListen() {
    if (Listen.playing && !Listen.finished) {
      if (!confirm('아직 다 듣지 않았어요. 지금 나가면 이번 듣기는 인정되지 않아요. 나갈까요?')) return;
    }
    if (Listen.audio) { Listen.audio.pause(); }
    loadDashboard(loadSession());
  }

  function logout() {
    localStorage.removeItem(SESSION_KEY);
    selGroup = selStudent = null;
    Mirror.stop();
    if (bootstrap) renderGroups(); else loadBootstrap();
  }

  return {
    init: init,
    show: show,
    showGroups: renderGroups,
    showTeacherLogin: function () { showPin('teacher'); },
    closeListen: closeListen,
    backToDash: function (sess) { loadDashboard(sess); },
    logout: logout
  };
})();

App.init();

// ===== 빌드 표식 =====
// 폰이 어떤 셸 버전을 쓰는지 로그인 화면에서 눈으로 확인하기 위한 표식.
// sw.js의 CACHE_VERSION과 함께 올린다. 폰에 이 값이 안 보이면 구버전 캐시를 쓰는 것.
var BUILD_VERSION = 'shell-v25';
(function () {
  var el = document.getElementById('build-stamp');
  if (el) el.textContent = BUILD_VERSION;
})();

// ===== 서비스워커 등록 (PWA 설치·오프라인 셸) =====
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js');
  // 새 서비스워커가 제어를 넘겨받으면 페이지를 한 번 리로드해 최신 셸을 즉시 반영한다.
  // (이게 없으면 새 SW가 활성화돼도 이미 로드된 구버전 화면이 그대로 남는다 — iOS 설치형 PWA에서 특히 문제)
  var swRefreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (swRefreshing) return;
    swRefreshing = true;
    window.location.reload();
  });
}
</script>
