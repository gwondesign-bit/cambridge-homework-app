<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>캠브리지 영어 숙제</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<meta name="theme-color" content="#F7F3EC">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="영어숙제">
<style>
  :root {
    --base: #F7F3EC;
    --surface: #FBF8F2;
    --accent: #E8743B;
    --accent-ink: #FBF8F2;
    --ink: #1A1A18;
    --muted: #8A8377;
    --line: #E8E2D6;
    --danger: #B3492E;
    --danger-bg: #F4E4D8;
    --warn: #8A6D1E;
    --warn-bg: #F7EBC7;
    --good: #4C7A4E;
    --good-bg: #E1EAD9;
    --neutral-bg: #E8E2D6;
    --card: var(--surface);
    --text: var(--ink);
    --primary: var(--accent);
    --radius: 16px;
    --radius-sm: 12px;
    --shadow: none;
    --shadow-sm: none;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: 'Pretendard', -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    background: var(--base);
    color: var(--ink);
    display: flex; justify-content: center;
    padding-top: env(safe-area-inset-top);
  }
  #app { width: 100%; max-width: 430px; min-height: 100%; padding: 24px 20px; display: flex; flex-direction: column; }
  h1, .dash-name, .step-title, .ls-title, .rc-timer, .hw-status,
  .rc-main-btn, .rc-result .title { font-weight: 700; }

  /* ===== 로그인 ===== */
  .brand { text-align: center; margin: 30px 0 10px; }
  .brand h1 { font-size: 26px; font-weight: 700; letter-spacing: -.3px; color: var(--ink); }
  .brand p { color: var(--muted); font-size: 14px; margin-top: 8px; }
  .build-stamp { font-size: 11px; opacity: 0.45; margin-top: 4px; }

  .step-title { font-size: 19px; margin: 26px 0 14px; font-weight: 700; }
  .back-btn { background: none; border: none; color: var(--muted); font-size: 14px; padding: 10px 0; cursor: pointer; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .choice-btn {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm);
    padding: 22px 12px; font-size: 17px; font-weight: 700; color: var(--ink);
    cursor: pointer; transition: transform .08s, border-color .08s;
  }
  .choice-btn:active { transform: scale(.97); border-color: var(--accent); }

  /* PIN */
  .pin-dots { display: flex; justify-content: center; gap: 18px; margin: 24px 0 10px; }
  .pin-dot { width: 16px; height: 16px; border-radius: 50%; background: var(--line); transition: transform .12s, background .12s; }
  .pin-dot.filled { background: var(--accent); transform: scale(1.15); }
  .pin-msg { text-align: center; min-height: 20px; font-size: 14px; color: var(--danger); margin-bottom: 8px; font-weight: 700; }
  .pin-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 8px; }
  .pin-key {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm);
    padding: 18px 0; font-size: 22px; font-weight: 700; color: var(--ink);
    cursor: pointer; transition: transform .06s;
  }
  .pin-key:active { transform: scale(.95); background: var(--line); }
  .pin-key.fn { font-size: 13px; color: var(--muted); background: transparent; border-color: transparent; }

  .teacher-link { margin-top: auto; padding-top: 28px; text-align: center; }
  .teacher-link button { background: none; border: none; color: var(--muted); font-size: 13px; text-decoration: underline; cursor: pointer; }

  /* ===== 로그인 후(선생님 자리표시) ===== */
  .home-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 30px 20px; text-align: center; margin-top: 32px; }
  .home-card .hello { font-size: 21px; font-weight: 700; margin-bottom: 8px; }
  .home-card .note { color: var(--muted); font-size: 13px; line-height: 1.6; }
  .logout-btn {
    margin-top: 20px; background: none; border: 1.5px solid var(--ink);
    color: var(--ink); border-radius: var(--radius-sm); padding: 12px 26px; font-size: 15px; font-weight: 700; cursor: pointer;
  }

  /* T-01 숙제 배부 */
  .tt-head { display: flex; align-items: center; justify-content: space-between; margin: 8px 0 18px; }
  .tt-title { font-size: 21px; font-weight: 700; }
  .tt-logout { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: var(--radius-sm); padding: 7px 14px; font-size: 13px; cursor: pointer; }
  .asg-sec { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }
  .asg-sec-t { font-weight: 700; font-size: 15px; margin-bottom: 12px; }
  .asg-seg { display: flex; gap: 8px; margin-bottom: 12px; }
  .asg-seg-btn { flex: 1; padding: 10px; border-radius: var(--radius-sm); border: 1px solid var(--line); background: var(--surface); color: var(--muted); font-size: 14px; cursor: pointer; }
  .asg-seg-btn.on { background: var(--ink); color: var(--surface); border-color: transparent; font-weight: 700; }
  .asg-targets { display: flex; flex-direction: column; gap: 2px; }
  .asg-grp-head { font-size: 12px; color: var(--muted); margin: 10px 0 2px; font-weight: 700; }
  .asg-check { display: flex; align-items: center; gap: 10px; padding: 9px 6px; cursor: pointer; font-size: 15px; }
  .asg-check input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--accent); flex: none; }
  .asg-input { width: 100%; padding: 11px 12px; border-radius: var(--radius-sm); border: 1px solid var(--line); font-size: 15px; font-family: inherit; background: var(--surface); box-sizing: border-box; color: var(--ink); }
  .asg-items { margin-top: 12px; display: flex; flex-direction: column; gap: 2px; }
  .asg-item { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .asg-item .asg-check { flex: 1; min-width: 55%; }
  .asg-count { width: 52px; padding: 7px; border-radius: 9px; border: 1px solid var(--line); font-size: 14px; text-align: center; background: var(--surface); color: var(--ink); }
  .asg-count-x { font-size: 12px; color: var(--muted); }
  .asg-row2 { display: flex; gap: 10px; }
  .asg-field { flex: 1; display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--muted); }
  .asg-summary { text-align: center; padding: 13px; border-radius: var(--radius-sm); background: var(--line); color: var(--muted); font-size: 14px; margin-bottom: 10px; }
  .asg-summary.ready { color: var(--ink); }
  .asg-summary b { color: var(--accent); }
  .asg-msg { text-align: center; font-size: 13px; color: var(--muted); min-height: 18px; margin-bottom: 8px; }
  .asg-hint { color: var(--muted); font-size: 13px; padding: 8px; }
  .asg-btn { width: 100%; padding: 15px; border: none; border-radius: var(--radius-sm); background: var(--accent); color: var(--accent-ink); font-size: 16px; font-weight: 700; cursor: pointer; }
  .asg-btn:disabled { opacity: .45; }

  /* --- 배부 v2 (Stage 3): 반 칩 · 요일 · 플랜 카드 · 페이지 가로 다이얼 --- */
  .asg-sub { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 4px; }
  .asg-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .asg-chip { padding: 11px 15px; border-radius: var(--radius-sm); border: 1px solid var(--line); background: var(--surface); font-size: 15px; font-family: inherit; cursor: pointer; color: var(--muted); }
  .asg-chip.on { background: var(--ink); color: var(--surface); border-color: transparent; font-weight: 700; }
  .asg-chip small { display: block; font-size: 11px; opacity: .8; font-weight: 400; }
  .asg-days { display: flex; gap: 6px; margin-top: 12px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .asg-day { flex: none; width: 40px; padding: 8px 0; text-align: center; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; font-family: inherit; color: var(--muted); cursor: pointer; }
  .asg-day.on { background: var(--ink); color: var(--surface); border-color: transparent; font-weight: 700; }
  .asg-day.none { opacity: .38; }
  .asg-day.today::after { content: ''; display: block; width: 4px; height: 4px; border-radius: 2px; background: var(--accent); margin: 3px auto 0; }

  .asg-card { border: 1px solid var(--line); border-radius: 13px; padding: 12px; margin-bottom: 10px; }
  .asg-card.off { opacity: .45; }
  .asg-card-h { display: flex; align-items: center; gap: 9px; }
  .asg-card-h input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--accent); flex: none; }
  .asg-card-t { flex: 1; font-size: 15px; font-weight: 700; }
  .asg-card-tag { font-size: 11px; color: var(--muted); background: var(--line); padding: 3px 8px; border-radius: 8px; }
  .asg-card-b { margin-top: 10px; }
  .asg-book { width: 100%; padding: 9px 10px; border-radius: 10px; border: 1px solid var(--line); font-size: 14px; font-family: inherit; background: var(--surface); box-sizing: border-box; margin-bottom: 9px; color: var(--ink); }
  .asg-bt { display: flex; gap: 6px; margin-bottom: 10px; }
  .asg-bt button { flex: 1; padding: 8px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-family: inherit; color: var(--muted); cursor: pointer; }
  .asg-bt button.on { background: var(--ink); color: var(--surface); border-color: transparent; font-weight: 700; }
  .asg-dial-l { font-size: 12px; color: var(--muted); margin-bottom: 4px; display: flex; justify-content: space-between; }
  .asg-dial-l b { color: var(--accent); font-size: 14px; }
  .asg-dial { display: flex; gap: 6px; overflow-x: auto; padding: 3px 0 8px; -webkit-overflow-scrolling: touch; scroll-snap-type: x proximity; }
  .asg-dial button { flex: none; width: 42px; height: 42px; border-radius: 11px; border: 1px solid var(--line); background: var(--surface); font-size: 15px; font-family: inherit; color: var(--muted); cursor: pointer; scroll-snap-align: center; }
  .asg-dial button.on { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 700; }
  .asg-dial button.between { background: rgba(232,116,59,.12); color: var(--accent); }
  .asg-bookname { font-size: 14px; font-weight: 700; color: var(--accent); margin-bottom: 10px; }
  .asg-auto { font-size: 12px; color: var(--muted); margin-top: 7px; }
  .asg-auto b { color: var(--accent); }
  .asg-add { width: 100%; padding: 11px; border-radius: var(--radius-sm); border: 1px dashed var(--line); background: var(--surface); color: var(--muted); font-size: 14px; font-family: inherit; cursor: pointer; }
  .asg-del { border: none; background: none; color: var(--muted); font-size: 18px; cursor: pointer; padding: 0 4px; }

  /* --- 선생님 탭 + 원생 관리(T-04) --- */
  .tt-tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .tt-tab { flex: 1; padding: 10px; border-radius: var(--radius-sm); border: 1px solid var(--line); background: var(--surface); color: var(--muted); font-size: 14px; font-family: inherit; cursor: pointer; }
  .tt-tab.on { background: var(--ink); color: var(--surface); border-color: transparent; font-weight: 700; }
  .mng-row { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .mng-row:last-child { border-bottom: none; }
  .mng-row-main { flex: 1; min-width: 0; }
  .mng-row-t { font-size: 15px; }
  .mng-row-s { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .mng-tag { font-size: 11px; padding: 3px 8px; border-radius: 8px; background: var(--line); color: var(--ink); font-weight: 700; }
  .mng-tag.warn { background: var(--warn-bg); color: var(--warn); }
  .mng-btn { padding: 7px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); font-size: 13px; font-family: inherit; cursor: pointer; flex: none; }
  .mng-btn.on { background: var(--ink); color: var(--surface); border-color: transparent; font-weight: 700; }
  .mng-lv { display: flex; gap: 6px; flex-wrap: wrap; }
  .mng-cnt { display: flex; align-items: center; gap: 8px; padding: 8px 0; }
  .mng-cnt-l { flex: 1; font-size: 14px; }
  .mng-step { display: flex; align-items: center; gap: 4px; }
  .mng-step button { width: 32px; height: 32px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); font-size: 17px; font-family: inherit; color: var(--muted); cursor: pointer; }
  .mng-step span { min-width: 26px; text-align: center; font-size: 15px; font-weight: 700; color: var(--accent); }
  .mng-note { font-size: 12px; color: var(--muted); margin-top: 6px; line-height: 1.5; }
  .mng-sub { font-size: 13px; color: var(--muted); font-weight: 400; margin-left: 4px; }
  .mng-pick { max-height: 240px; overflow-y: auto; margin: 6px 0 10px; }
  .mng-save { position: sticky; bottom: 8px; background: var(--surface); border: 1.5px solid var(--ink); border-radius: var(--radius); padding: 13px; margin-top: 4px; }
  .mng-save-list { font-size: 12px; color: var(--muted); line-height: 1.7; margin-bottom: 10px; max-height: 130px; overflow-y: auto; }
  .mng-save-row { display: flex; gap: 8px; align-items: stretch; }
  .mng-save-row .mng-btn { flex: none; }
  .mng-save-row .asg-btn { flex: 1; padding: 12px; font-size: 15px; }

  /* --- T-02 제출 현황 --- */
  .rv-counts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
  .rv-chip { padding: 7px 11px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-family: inherit; color: var(--muted); cursor: pointer; }
  .rv-chip.on { border-color: transparent; color: var(--surface); font-weight: 700; background: var(--ink); }
  .rv-chip b { font-weight: 700; }
  .rv-chip.b-재제출요청.on, .rv-chip.b-플래그.on { background: var(--danger); }
  .rv-chip.b-미제출.on { background: var(--muted); }
  .rv-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 13px 14px; margin-bottom: 9px; border-left: 4px solid var(--line); }
  .rv-card.b-재제출요청, .rv-card.b-플래그 { border-left-color: var(--danger); }
  .rv-card.b-미제출 { border-left-color: var(--muted); }
  .rv-card.b-미검사 { border-left-color: var(--warn); }
  .rv-card.b-완료 { border-left-color: var(--good); }
  .rv-card.b-면제 { border-left-color: var(--line); }
  .rv-top { display: flex; align-items: center; gap: 8px; }
  .rv-name { font-size: 15px; font-weight: 700; }
  .rv-badge { font-size: 11px; padding: 3px 8px; border-radius: 8px; background: var(--neutral-bg); color: var(--muted); font-weight: 700; }
  .rv-badge.warn { background: var(--warn-bg); color: var(--warn); }
  .rv-badge.danger { background: var(--danger-bg); color: var(--danger); }
  .rv-badge.ok { background: var(--good-bg); color: var(--good); }
  .rv-label { font-size: 14px; color: var(--ink); margin-top: 5px; }
  .rv-meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .rv-actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .rv-btn { padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); font-size: 13px; font-family: inherit; cursor: pointer; }
  .rv-btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 700; }
  .rv-btn.danger { background: var(--surface); color: var(--danger); border-color: var(--danger-bg); }
  .rv-btn:disabled { opacity: .5; }
  .rv-panel { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
  .rv-panel audio { width: 100%; margin: 6px 0; }
  .rv-cmt { width: 100%; padding: 9px 10px; border-radius: 10px; border: 1px solid var(--line); font-size: 14px; font-family: inherit; box-sizing: border-box; resize: vertical; min-height: 58px; background: var(--surface); color: var(--ink); }
  .rv-hist { font-size: 12px; color: var(--muted); margin-top: 8px; line-height: 1.7; }
  .rv-empty { text-align: center; color: var(--muted); font-size: 14px; padding: 30px 0; }

  /* 로딩: 처음 만들었던 conic-gradient 훑기+숨쉬기 연출(2026-08-01 재적용).
     실기기에서 "반쪽만 보이던" 원인은 이 애니메이션이 아니라 로고 원본
     파일 자체가 DesignSync에서 잘려 온 것이었다(에셋이 복구되면 이 연출이
     정상적으로 보여야 한다). 로고가 완전한 파일로 교체되면 확인할 것. */
  .loading { text-align: center; padding: 56px 0; }
  @property --wipe { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
  .loading .logo-wipe { width: 84px; height: 84px; margin: 0 auto 16px; }
  .loading .logo-wipe img {
    width: 100%; height: 100%; object-fit: contain;
    -webkit-mask-image: conic-gradient(black var(--wipe, 0deg), transparent var(--wipe, 0deg));
    mask-image: conic-gradient(black var(--wipe, 0deg), transparent var(--wipe, 0deg));
    animation: logoWipe .7s cubic-bezier(.3,.6,.3,1) both, logoPulse 1.6s ease-in-out .7s infinite;
  }
  @keyframes logoWipe { from { --wipe: 0deg; } to { --wipe: 360deg; } }
  @keyframes logoPulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
  .hidden { display: none; }

  /* ===== 인터랙션 (2026-07-31) — 가볍고 즉각적인 전환·탭 피드백 ===== */
  @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes screenIn { from { opacity: 0; transform: translateY(18px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
  .screen-anim { animation: screenIn .38s cubic-bezier(.22,.8,.28,1) both; }
  @media (prefers-reduced-motion: reduce) {
    .screen-anim, .hw-card, .rc-result .big { animation: none !important; }
  }
  /* 목록 항목은 새로 생성될 때마다 자동으로 살짝 떠오르며 나타난다.
     ⚠ .asg-card(T-01 페이지 다이얼)·.mng-row(T-04 회수 스테퍼)·.rv-card(T-02)는
     일부러 뺐다 — 이 목록들은 화면 로드가 아니라 다이얼·스테퍼·"듣고 검사" 토글을
     한 번 누를 때마다 그 목록 전체를 다시 그리므로(renderPlan()/render()/renderList()),
     여기에 애니메이션을 걸면 탭할 때마다 관련 없는 카드까지 깜빡이며 다시 나타나는
     것처럼 보인다(2026-08-01 확인). 화면에 "처음 들어올 때"만 리스트가 그려지는
     hw-card(S-01 대시보드)만 적용. */
  .hw-card { animation: fadeUp .3s ease both; }
  .hw-card:nth-child(2) { animation-delay: .03s; }
  .hw-card:nth-child(3) { animation-delay: .06s; }
  .hw-card:nth-child(4) { animation-delay: .09s; }
  .hw-card:nth-child(5) { animation-delay: .12s; }
  .hw-card:nth-child(n+6) { animation-delay: .15s; }
  /* 선택 상태(칩·탭·다이얼) 전환을 부드럽게 — 색이 뚝 끊기지 않도록 */
  .asg-chip, .asg-day, .asg-seg-btn, .asg-bt button, .tt-tab, .mng-btn, .rv-chip, .asg-dial button,
  .rv-btn, .mng-step button, .pin-key, .choice-btn, .hw-card {
    transition: background-color .15s ease, border-color .15s ease, color .15s ease, transform .08s ease, opacity .15s ease;
  }
  .asg-chip:active, .asg-day:active, .asg-seg-btn:active, .asg-bt button:active, .tt-tab:active,
  .mng-btn:active, .rv-chip:active, .asg-dial button:active, .rv-btn:active, .mng-step button:active {
    transform: scale(.94);
  }
  /* 체크마크가 그려지듯 나타나는 제출 완료 연출 */
  .rc-result .big { animation: fade-in .25s ease, pop .25s cubic-bezier(.3,1.6,.4,1) .05s both; }
  @keyframes pop { from { transform: scale(.6); } to { transform: scale(1); } }
  .rc-result .big svg path { stroke-dasharray: 26; stroke-dashoffset: 26; animation: checkDraw .35s ease .15s forwards; }
  @keyframes checkDraw { to { stroke-dashoffset: 0; } }

  /* ===== S-01 오늘의 숙제 ===== */
  .dash-head { display: flex; align-items: flex-start; justify-content: space-between; padding: 4px 2px 0; }
  .dash-date { font-size: 13px; color: var(--muted); }
  .dash-name { font-size: 22px; margin-top: 4px; letter-spacing: -.3px; font-weight: 700; }
  .dash-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .dash-logout, .dash-mypage { background: none; border: none; color: var(--muted); font-size: 12px;
    padding: 2px 0; cursor: pointer; font-family: inherit; white-space: nowrap; }
  .mp-hist-head { font-size: 15px; font-weight: 700; margin: 18px 4px 8px; }
  .mp-hist { display: flex; flex-direction: column; gap: 2px; }
  .mp-hist-row { display: flex; justify-content: space-between; align-items: baseline; background: var(--surface);
    border: 1px solid var(--line); border-radius: 12px; padding: 11px 14px; }
  .mp-hist-label { font-size: 14px; }
  .mp-hist-date { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .mp-hist-amt { font-size: 15px; font-weight: 700; color: var(--ink); flex: none; margin-left: 10px; }
  .mp-empty { text-align: center; color: var(--muted); font-size: 14px; padding: 30px 0; }
  /* S-01 대시보드에서는 포인트/스트릭 칩·등급 바·오늘 받은 포인트 배너를 노출하지 않는다
     (2026-07-31 확정 — "오늘 완료 N/M"만 담백하게 보여준다). 마이페이지에서는 그대로 표시. */
  #screen-dash .chips, #screen-dash .tier-box, #screen-dash .awards { display: none; }
  .chips { display: flex; gap: 10px; margin: 14px 0 0; }
  .chip { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 9px 16px; font-size: 14px; color: var(--ink); }
  .tier-box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 16px; margin: 10px 0; }
  .tier-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 7px; }
  .tier-row b { color: var(--ink); font-size: 13px; }
  .tier-bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
  .tier-bar > div { height: 100%; border-radius: 4px; transition: width .5s ease; background: var(--accent); }
  .awards { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 16px; margin: 8px 0; }
  .awards .aw-title { font-size: 12px; color: var(--muted); font-weight: 700; margin-bottom: 5px; }
  .awards .aw-row { display: flex; justify-content: space-between; font-size: 14px; padding: 3px 0; }
  .awards .aw-row b { color: var(--ink); }
  .today-progress { margin: 20px 0 8px; }
  .today-progress .tp-label { display: flex; justify-content: space-between; align-items: baseline; font-size: 15px; margin-bottom: 7px; }
  .today-progress .tp-label b { font-size: 17px; font-weight: 700; }
  .today-progress .tp-label span { font-size: 13px; color: var(--muted); }
  .tp-bar { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
  .tp-bar > div { height: 100%; background: var(--accent); border-radius: 2px; transition: width .5s ease; }
  .cards { display: flex; flex-direction: column; gap: 0; margin-top: 8px; padding-bottom: 28px; }
  .hw-card {
    background: transparent; border-top: 1px solid var(--line); padding: 15px 2px; display: flex; align-items: center; gap: 12px;
    cursor: pointer; transition: transform .08s;
  }
  .hw-card:active { transform: scale(.98); }
  .hw-icon {
    width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; background: #FBE4D2; color: var(--accent);
  }
  .hw-icon svg { width: 19px; height: 19px; }
  .st-done .hw-icon, .st-doing .hw-icon { opacity: .55; }
  .hw-main { flex: 1; min-width: 0; }
  .hw-subject { font-size: 11.5px; font-weight: 400; color: var(--muted); letter-spacing: .2px; }
  .hw-label { font-size: 15.5px; font-weight: 700; margin: 2px 0; color: var(--ink); }
  .hw-meta { font-size: 12px; color: var(--muted); }
  .hw-meta .overdue { color: var(--danger); font-weight: 700; }
  .hw-status { font-size: 11.5px; font-weight: 700; flex-shrink: 0; padding: 5px 10px; border-radius: 8px; background: var(--neutral-bg); color: var(--muted); }
  .st-redo .hw-status { background: var(--danger-bg); color: var(--danger); }
  .st-todo .hw-status { background: var(--neutral-bg); color: var(--muted); }
  .st-doing .hw-status { background: var(--neutral-bg); color: var(--ink); }
  .st-done .hw-status { background: var(--good-bg); color: var(--good); }
  .empty-note { text-align: center; color: var(--muted); font-size: 15px; padding: 44px 0; line-height: 1.8; white-space: pre-line; }

  /* ===== S-02 듣기 학습 ===== */
  .ls-head { margin-bottom: 8px; }
  .ls-subject { font-size: 12px; font-weight: 700; color: var(--accent); }
  .ls-title { font-size: 21px; margin-top: 2px; font-weight: 700; }
  .ls-count { font-size: 13px; color: var(--muted); margin-top: 5px; }
  .ls-count b { color: var(--accent); font-size: 14px; }
  .ls-transcript {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; margin: 12px 0;
    font-size: 15px; line-height: 2.0; max-height: 40vh; overflow-y: auto; white-space: pre-wrap;
  }
  .ls-transcript.empty { color: var(--muted); text-align: center; font-size: 14px; }
  .ls-progress { margin: 14px 0 4px; }
  .ls-bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .ls-bar > div { height: 100%; background: var(--accent); border-radius: 3px; }
  .ls-time { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 5px; }
  .ls-controls { display: flex; justify-content: center; align-items: center; gap: 18px; margin: 18px 0; }
  .ls-btn {
    border: 1px solid var(--line); border-radius: 50%; width: 56px; height: 56px; font-size: 20px;
    background: var(--surface); color: var(--ink); cursor: pointer; transition: transform .08s;
    font-variant-emoji: text;
  }
  .ls-btn.main {
    width: 78px; height: 78px; font-size: 26px; color: var(--accent-ink);
    background: var(--accent); border-color: transparent;
  }
  .ls-btn:active { transform: scale(.93); }
  .ls-btn:disabled { opacity: .4; }
  .ls-msg { text-align: center; min-height: 22px; font-size: 15px; font-weight: 700; }
  .ls-msg.good { color: var(--good); }
  .ls-msg.bad { color: var(--danger); }
  .ls-note { text-align: center; font-size: 11px; color: var(--muted); margin-top: 8px; }

  /* ===== S-03 녹음·제출 ===== */
  .rc-stage { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 28px 16px; margin: 14px 0; text-align: center; }
  .rc-timer { font-size: 40px; letter-spacing: 2px; margin: 10px 0; color: var(--ink); font-weight: 700; }
  .rc-state-label { font-size: 14px; color: var(--muted); min-height: 20px; }
  .rc-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--danger);
    margin-right: 6px; animation: rc-blink 1s infinite; vertical-align: 1px; }
  @keyframes rc-blink { 50% { opacity: .2; } }
  .rc-main-btn {
    border: none; border-radius: var(--radius-sm); padding: 15px 30px; font-size: 15px; font-weight: 700;
    color: var(--accent-ink); cursor: pointer; margin-top: 14px; transition: transform .08s;
    background: var(--ink);
  }
  /* 녹음 대기(rec) 상태는 목업처럼 원형 아이콘 버튼, 사진 모드는 전체 폭 텍스트 버튼 */
  .rc-main-btn.rec:not(.photo) { width: 84px; height: 84px; border-radius: 50%; padding: 0; background: var(--accent); display: inline-flex; align-items: center; justify-content: center; }
  .rc-main-btn.rec:not(.photo) svg { width: 28px; height: 28px; }
  .rc-main-btn.rec.photo { width: 100%; background: var(--accent); }
  .rc-main-btn.stop { background: var(--ink); }
  .rc-main-btn.submit { background: var(--accent); }
  .rc-photo { max-width: 100%; max-height: 320px; border-radius: 12px; margin: 12px auto 0; display: block; border: 1px solid var(--line); }
  .rc-main-btn:disabled { opacity: .5; }
  .rc-main-btn:active { transform: scale(.96); }
  .rc-sub-btn { border: none; background: none; color: var(--muted); font-size: 14px;
    text-decoration: underline; cursor: pointer; margin-top: 16px; }
  .rc-preview { width: 100%; margin-top: 14px; }
  .rc-result { text-align: center; }
  .rc-result .big { display: inline-flex; width: 48px; height: 48px; align-items: center; justify-content: center;
    border-radius: 50%; background: var(--good-bg); color: var(--good); }
  .rc-result .big svg { width: 24px; height: 24px; }
  @keyframes fade-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  .rc-result .title { font-size: 20px; margin: 10px 0 4px; font-weight: 700; }
  .rc-result .sub { font-size: 13px; color: var(--muted); }
  .rc-awards { margin: 14px auto 0; max-width: 300px; text-align: left; }

  /* ===== 거울 모드 (설계결정문서 5.4) — 저장 안 하는 카메라 프리뷰 ===== */
  .mirror-preview {
    position: fixed; bottom: 16px; right: 16px; width: 92px; height: 122px;
    border-radius: 16px; overflow: hidden; z-index: 40;
    border: 2.5px solid var(--surface); background: #000;
  }
  .mirror-preview video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); display: block; }
  .mirror-badge {
    position: absolute; top: 4px; left: 4px; font-size: 9px; color: #fff;
    background: rgba(0,0,0,.5); border-radius: 6px; padding: 1px 5px; z-index: 1;
  }
</style>
</head>
<body>
<div id="app">
  <div class="brand">
    <h1>캠브리지 영어 숙제</h1>
    <p id="brand-sub">오늘도 반가워요!</p>
    <p id="build-stamp" class="build-stamp"></p>
  </div>

  <div id="screen-loading" class="loading">
    <div class="logo-wipe"><img src="assets/cambridge-logo.png" alt="불러오는 중"></div>
  </div>

  <!-- 1단계: 반 선택 -->
  <div id="screen-group" class="hidden">
    <div class="step-title">우리 반을 골라주세요</div>
    <div id="group-grid" class="grid"></div>
    <div class="teacher-link"><button onclick="App.showTeacherLogin()">선생님 로그인</button></div>
  </div>

  <!-- 2단계: 이름 선택 -->
  <div id="screen-name" class="hidden">
    <button class="back-btn" onclick="App.showGroups()">&larr; 반 다시 고르기</button>
    <div class="step-title" id="name-title">이름을 골라주세요</div>
    <div id="name-grid" class="grid"></div>
  </div>

  <!-- 3단계: PIN 입력 (학생/선생님 공용) -->
  <div id="screen-pin" class="hidden">
    <button class="back-btn" id="pin-back">&larr; 뒤로</button>
    <div class="step-title" id="pin-title">비밀번호 4자리를 눌러주세요</div>
    <div class="pin-dots">
      <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
    </div>
    <div class="pin-msg" id="pin-msg"></div>
    <div class="pin-pad" id="pin-pad"></div>
  </div>

  <!-- 선생님 자리표시 (4.1 현황판에서 교체) -->
  <div id="screen-home" class="hidden">
    <div class="home-card">
      <div class="hello" id="home-hello"></div>
      <div class="note" id="home-note"></div>
      <button class="logout-btn" onclick="App.logout()">로그아웃</button>
    </div>
  </div>

  <!-- T-02 제출 현황·검사 (선생님) -->
  <div id="screen-review" class="hidden">
    <div class="tt-head">
      <div class="tt-title">제출 현황</div>
      <button class="tt-logout" onclick="App.logout()">로그아웃</button>
    </div>
    <div class="tt-tabs">
      <button class="tt-tab" onclick="Teacher.go('assign')">배부</button>
      <button class="tt-tab on">제출 현황</button>
      <button class="tt-tab" onclick="Teacher.go('manage')">원생 관리</button>
    </div>

    <div class="asg-sec">
      <div id="rv-filters"></div>
      <div id="rv-counts" class="rv-counts"></div>
    </div>

    <div id="rv-list"></div>
    <div id="rv-msg" class="asg-msg"></div>
  </div>

  <!-- T-04 원생·반 관리 (선생님) — 잘 안 바뀌는 설정: 반 레벨·교재·기본 회수 -->
  <div id="screen-manage" class="hidden">
    <div class="tt-head">
      <div class="tt-title">원생 관리</div>
      <button class="tt-logout" onclick="App.logout()">로그아웃</button>
    </div>
    <div class="tt-tabs">
      <button class="tt-tab" onclick="Teacher.go('assign')">배부</button>
      <button class="tt-tab" onclick="Teacher.go('review')">제출 현황</button>
      <button class="tt-tab on">원생 관리</button>
    </div>

    <div class="asg-sec">
      <div class="asg-sec-t">어느 반</div>
      <div id="mng-groups" class="asg-chips"></div>
    </div>

    <div id="mng-body"></div>
    <div id="mng-msg" class="asg-msg"></div>
  </div>

  <!-- T-01 숙제 배부 (선생님) -->
  <div id="screen-assign" class="hidden">
    <div class="tt-head">
      <div class="tt-title">숙제 배부</div>
      <button class="tt-logout" onclick="App.logout()">로그아웃</button>
    </div>
    <div class="tt-tabs">
      <button class="tt-tab on">배부</button>
      <button class="tt-tab" onclick="Teacher.go('review')">제출 현황</button>
      <button class="tt-tab" onclick="Teacher.go('manage')">원생 관리</button>
    </div>

    <div class="asg-sec">
      <div class="asg-sec-t">1. 어느 반</div>
      <div id="asg-groups" class="asg-chips"></div>
      <div id="asg-day" class="asg-days"></div>
    </div>

    <div id="asg-plan-sec" class="asg-sec hidden">
      <div class="asg-sec-t">2. 오늘 숙제 <span id="asg-plan-sub" class="asg-sub"></span></div>
      <div id="asg-plan"></div>
      <button class="asg-add" onclick="Assign.addCustom()">＋ 자유 항목 추가</button>
    </div>

    <div id="asg-due-sec" class="asg-sec hidden">
      <div class="asg-sec-t">3. 언제까지</div>
      <div class="asg-row2">
        <label class="asg-field"><span>마감일</span><input id="asg-due-date" class="asg-input" type="date" onchange="Assign.updateSummary()"></label>
        <label class="asg-field"><span>마감시각</span><input id="asg-due-time" class="asg-input" type="time" value="21:00"></label>
      </div>
    </div>

    <div id="asg-summary" class="asg-summary"></div>
    <div id="asg-msg" class="asg-msg"></div>
    <button id="asg-submit" class="asg-btn" onclick="Assign.submit()" disabled>배부하기</button>
  </div>

  <!-- S-01 오늘의 숙제 (학생 대시보드) -->
  <div id="screen-dash" class="hidden">
    <div class="dash-head">
      <div>
        <div class="dash-date" id="dash-date"></div>
        <div class="dash-name" id="dash-name"></div>
      </div>
      <div class="dash-actions">
        <button class="dash-mypage" id="dash-mypage-btn">마이페이지</button>
        <button class="dash-logout" onclick="App.logout()">로그아웃</button>
      </div>
    </div>
    <div class="chips">
      <div class="chip point" id="chip-point">0P</div>
      <div class="chip streak" id="chip-streak">0일</div>
    </div>
    <div class="tier-box" id="tier-box">
      <div class="tier-row"><span>내 등급 <b id="tier-cur">Starter</b></span><span id="tier-need"></span></div>
      <div class="tier-bar"><div id="tier-fill" style="width:0%"></div></div>
    </div>
    <div class="awards hidden" id="awards-box">
      <div class="aw-title">오늘 받은 포인트</div>
      <div id="awards-list"></div>
    </div>
    <div class="today-progress">
      <div class="tp-label"><b>오늘의 숙제</b><span id="tp-count">0/0 완료</span></div>
      <div class="tp-bar"><div id="tp-fill" style="width:0%"></div></div>
    </div>
    <div class="cards" id="hw-cards"></div>
  </div>

  <!-- 3.7 마이페이지: 포인트 전체 내역·등급·스트릭. 배지함은 지급 엔진이 없어 후속 -->
  <div id="screen-mypage" class="hidden">
    <button class="back-btn" onclick="MyPage.close()">&larr; 오늘의 숙제로</button>
    <div class="dash-head">
      <div>
        <div class="dash-date" id="mp-group"></div>
        <div class="dash-name" id="mp-name"></div>
      </div>
    </div>
    <div class="chips">
      <div class="chip point" id="mp-point">0P</div>
      <div class="chip streak" id="mp-streak">0일</div>
    </div>
    <div class="tier-box" id="mp-tier-box">
      <div class="tier-row"><span>내 등급 <b id="mp-tier-cur">Starter</b></span><span id="mp-tier-need"></span></div>
      <div class="tier-bar"><div id="mp-tier-fill" style="width:0%"></div></div>
    </div>
    <div class="mp-hist-head">포인트 내역</div>
    <div class="mp-hist" id="mp-history"></div>
  </div>

  <!-- S-02 듣기 학습 -->
  <div id="screen-listen" class="hidden">
    <button class="back-btn" onclick="App.closeListen()">&larr; 오늘의 숙제로</button>
    <div class="ls-head">
      <div class="ls-subject" id="ls-subject"></div>
      <div class="ls-title" id="ls-title"></div>
      <div class="ls-count">유효 듣기 <b id="ls-count">0</b>/<span id="ls-required">1</span>회</div>
    </div>
    <div class="ls-transcript" id="ls-transcript"></div>
    <div class="ls-progress">
      <div class="ls-bar"><div id="ls-fill" style="width:0%"></div></div>
      <div class="ls-time"><span id="ls-cur">0:00</span><span id="ls-dur">-:--</span></div>
    </div>
    <div class="ls-controls">
      <button class="ls-btn" id="ls-restart" title="처음부터">&#9198;&#xFE0E;</button>
      <button class="ls-btn main" id="ls-play" title="재생">&#9654;&#xFE0E;</button>
    </div>
    <div class="ls-msg" id="ls-msg"></div>
    <div class="ls-note">끝까지 들으면 자동으로 기록돼요. 앞으로 넘기기는 없어요!</div>
  </div>

  <!-- S-03 녹음·제출 -->
  <div id="screen-record" class="hidden">
    <button class="back-btn" id="rc-back">&larr; 오늘의 숙제로</button>
    <div class="ls-head">
      <div class="ls-subject" id="rc-subject"></div>
      <div class="ls-title" id="rc-title"></div>
      <div class="ls-count" id="rc-due"></div>
    </div>

    <!-- 읽을 본문 (있을 때만) -->
    <div class="ls-transcript hidden" id="rc-transcript"></div>

    <!-- 녹음 전/중/미리듣기 -->
    <div class="rc-stage" id="rc-stage">
      <div class="rc-state-label" id="rc-state-label">녹음 버튼을 누르고 또박또박 읽어주세요</div>
      <div class="rc-timer" id="rc-timer">0:00</div>
      <button class="rc-main-btn rec" id="rc-main" aria-label="녹음 시작"></button>
      <audio class="rc-preview hidden" id="rc-preview" controls></audio>
      <!-- 사진 제출(write) — 카메라 또는 갤러리에서 선택. capture는 폰에서 바로 카메라를 연다 -->
      <input type="file" id="rc-file" accept="image/*" capture="environment" class="hidden">
      <img class="rc-photo hidden" id="rc-photo" alt="제출할 사진 미리보기">
      <div><button class="rc-sub-btn hidden" id="rc-again">다시 녹음하기</button></div>
    </div>

          subject:'기사', label:'기사 본문 읽기', seq:'', action_mode:'read', bucket:'재제출요청',
          item_status:'재제출요청', due_date:'2026-07-26', due_time:'21:00', attempt_no:1, attempts:1,
          submitted_at:'2026-07-26 18:02:00', flag:'', review_status:'반려', has_audio:true, comment:'조금 더 크게 읽어볼까요?' },
        // 사진 제출(QnA 손글씨·파닉스 쓰기) — 검사 화면이 <img>로 보여줘야 하는 건
        { item_id:'AI-5', submission_id:'SUB-5', student_id:'S002', student_name:'이영희', group_id:'G-A',
          subject:'QnA', label:'Q&A 서술형 답안', seq:'', action_mode:'write', bucket:'미검사',

      ]
    },
    getReviewBoard: function (token, groupId, dueDate) {
      var rows = this._rv.rows.filter(function (r) {
        return (!groupId || r.group_id === groupId) && (!dueDate || r.due_date === dueDate);
      });
      // 서버(Review.gs)와 같은 순서로 정렬해야 로컬에서 본 화면이 실서버와 같다
      var ORDER = { '재제출요청':0, '플래그':1, '미제출':2, '미검사':3, '완료':4, '면제':5 };
      var ord = function (b) { return ORDER[b] === undefined ? 9 : ORDER[b]; }; // 0이 falsy라 || 금지
      rows = rows.slice().sort(function (x, y) {
        var d = ord(x.bucket) - ord(y.bucket);
        if (d !== 0) return d;
        d = String(y.due_date).localeCompare(String(x.due_date));
        if (d !== 0) return d;
        return String(x.student_name).localeCompare(String(y.student_name), 'ko');
      });
      var counts = {};
      rows.forEach(function (r) { counts[r.bucket] = (counts[r.bucket] || 0) + 1; });
      return { ok: true,
        groups: [{ group_id:'G-A', group_name:'A반' }, { group_id:'G-B', group_name:'B반' }],

    getSubmissionAudio: function (token, submissionId) {

      }
      // 무음 wav 한 조각 — 재생 컨트롤이 뜨는지만 확인하는 용도
      return { ok: true, mimeType: 'audio/wav', attempt_no: 1, submitted_at: '2026-07-27 19:20:11',

    getSubmissionHistory: function (token, itemId) {
      return { ok: true, submissions: [
        { submission_id:'SUB-2', attempt_no:2, submitted_at:'2026-07-27 20:05:40', flag:'해시중복의심', review_status:'대기', is_latest:true, comment:'' },
        { submission_id:'SUB-2a', attempt_no:1, submitted_at:'2026-07-26 21:10:00', flag:'', review_status:'반려', is_latest:false, comment:'다시 해볼까요?' }
      ] };

    reviewSubmission: function (token, submissionId, action, comment) {
      var r = this._rv.rows.filter(function (x) { return x.submission_id === submissionId; })[0];
      if (!r) return { ok: false, message: '제출 기록을 찾을 수 없어요.' };
      if (action === 'reject' && !String(comment || '').trim()) return { ok: false, message: '반려 사유를 적어주세요.' };
      r.review_status = action === 'approve' ? '확인' : '반려';
      r.item_status = action === 'approve' ? '제출완료' : '재제출요청';
      r.bucket = action === 'approve' ? '완료' : '재제출요청';
      if (comment) r.comment = comment;
      return { ok: true, action: action };
    },
    exemptItem: function (token, itemId, comment) {
      var r = this._rv.rows.filter(function (x) { return x.item_id === itemId; })[0];
      if (!r) return { ok: false, message: '항목을 찾을 수 없어요.' };
      r.item_status = '면제'; r.bucket = '면제';
      if (comment) r.comment = '[면제] ' + comment;
      return { ok: true, item_id: itemId };
    },
    // 변경분 일괄 저장 — 서버와 같은 순서(반 설정 → 교재 → 이동 → 학생)로 적용
    saveManageBatch: function (token, changes) {
      var self = this;
      var failed = [];
      if (changes.level || changes.defaults) {
        var r = self.saveGroupSettings(token, changes.groupId, {
          level: changes.level, defaults: changes.defaults || {}
        });
        if (!r.ok) failed.push('반 설정');
      }
      Object.keys(changes.books || {}).forEach(function (subj) {
        var b = self.saveGroupBook(token, changes.groupId, subj, changes.books[subj]);
        if (!b.ok) failed.push(subj + ' 교재');
      });
      var byTarget = {};
      Object.keys(changes.moves || {}).forEach(function (sid) {
        var to = changes.moves[sid];
        (byTarget[to] = byTarget[to] || []).push(sid);
      });
      Object.keys(byTarget).forEach(function (to) {
        var m = self.assignStudentsToGroup(token, to, byTarget[to]);
        if (!m.ok) failed.push('반 이동');
      });
      Object.keys(changes.students || {}).forEach(function (sid) {
        var s = self.saveStudentSettings(token, sid, changes.students[sid]);
        if (!s.ok) failed.push(sid);
      });
      return { ok: failed.length === 0, applied: changes, failed: failed };
    },
    createAssignments: function (token, payload) {
      // 서버와 같은 규칙으로 학생별 회수를 확장해 건수를 계산(화면 요약과 대조용)
      var studs = [ { voca_count: 3, read_count: 1, pattern_count: 0 }, { voca_count: 1, read_count: 2, pattern_count: 3 } ];
      var total = 0, n = 0;
      studs.forEach(function (s) {
        var c = 0;
        (payload.items || []).forEach(function (it) { c += it.count_field ? (s[it.count_field] || 0) : 1; });
        if (c > 0) { n++; total += c; }
      });
      return { ok: true, students: n, items: total, batch_id: 'B-mock', progress_updated: 1 };
    }
  };
  // mock도 실서버와 똑같이 bodyOf를 거친 뒤, 그 body에서 인자를 되꺼내 호출한다.
  // 이렇게 해야 "화면은 넘겼는데 매핑에서 빠진" 인자가 로컬 미리보기에서도 그대로 재현된다.
  return {
    call: function (fn, args, onOk) {
      var body = bodyOf(fn, args);
      var passed = ARG_NAMES[fn].map(function (n) { return body[n]; });
      setTimeout(function () { onOk(MOCK[fn].apply(MOCK, passed)); }, 150);
    }
  };
})();

// ===== 거울 모드 (설계결정문서 5.4) — 독립 모듈 =====
// 듣기·녹음 화면에 들어가면 자동으로 켜지고, 화면을 떠나면 즉시 완전히 꺼진다.
// 동의를 묻지 않는다(학생이 스스로 켤 이유가 없으므로). 저장하지 않으며 "저장 안 됨"을 프리뷰에 상시 표시.
// 카메라를 못 켜거나 거부해도 학습에는 지장이 없으므로 조용히 넘어간다.
var Mirror = (function () {
  var stream = null;
  var wanted = false; // 지금 학습화면에 있어 켜져 있어야 하는가 (getUserMedia 비동기 경쟁 방지용)
  function $(id) { return document.getElementById(id); }

  // 듣기/녹음 화면 진입 → 자동 켜기
  function enter() {
    wanted = true;
    if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) return;
    if (stream) { showPreview(); return; }
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false })
      .then(function (s) {
        // 스트림이 준비되기 전에 화면을 떠났으면 바로 정리 (카메라가 켜진 채 남지 않도록)
        if (!wanted) { s.getTracks().forEach(function (t) { t.stop(); }); return; }
        stream = s;
        $('mirror-video').srcObject = s;
        showPreview();
      })
      .catch(function () { /* 카메라 거부/불가 — 무시 */ });
  }
  function showPreview() { if (stream) $('mirror-preview').classList.remove('hidden'); }
  // 학습화면 이탈·로그아웃 → 카메라 완전 종료 (프리뷰만 숨기는 게 아니라 스트림을 끈다)
  function stop() {
    wanted = false;
    if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
    var v = $('mirror-video'); if (v) v.srcObject = null;
    $('mirror-preview').classList.add('hidden');
  }
  return { enter: enter, stop: stop };
})();

// ===== T-01 숙제 배부 (선생님) — 독립 모듈 =====
// 반/학생 선택 → 콘텐츠 선택 → 표준 항목 체크 → 마감 설정 → "N명에게 M건" 확인 후 생성.
/**
 * Teacher — 선생님 화면 전환(배부 ↔ 원생 관리)
 * 잘 안 바뀌는 설정(레벨·교재·기본 회수)은 관리 화면, 매일 하는 일은 배부 화면.
 */
var Teacher = (function () {
  var sess = null;
  return {
    start: function (s) { sess = s; Assign.open(s); },
    go: function (where) {
      if (!sess) return;
      // 관리 화면에 저장 안 한 변경분이 있으면 나가기 전에 물어본다
      if (where !== 'manage' && Manage.hasUnsaved() &&
          !confirm('저장하지 않은 변경이 있어요. 버리고 나갈까요?')) return;
      if (where === 'manage') Manage.open(sess);
      else if (where === 'review') Review.open(sess);
      else Assign.open(sess);
    }
  };
})();

/**
 * Review — 제출 현황·검사 T-02 (WBS 4.1)
 *
 * "지금 처리할 것"이 위로 오게 정렬한다: 재제출요청 → 플래그 → 미제출 → 미검사 → 완료.
 * 녹음은 드라이브 직링크가 아니라 서버 프록시(base64)로 받아 재생한다 — CLAUDE.md 음원 규칙.

var Review = (function () {
  function $(id) { return document.getElementById(id); }
  var token = null, data = null, groupId = '', dueDate = '', bucket = '', openItem = null;
  var BUCKETS = ['재제출요청', '플래그', '미제출', '미검사', '완료', '면제'];

  function open(s) {
    token = s.token;
    App.show('screen-review');
    $('rv-list').innerHTML = '<div class="asg-hint">불러오는 중...</div>';

    load();

  function load(keepMsg) {
    if (!keepMsg) msg('');
    Server.call('getReviewBoard', [token, groupId, dueDate], function (res) {
      if (!res.ok) {
        if (res.needLogin) { App.logout(); return; }
        $('rv-list').innerHTML = '<div class="asg-hint">불러오지 못했어요.</div>';

      renderCounts();

  function renderFilters() {
    var box = $('rv-filters');

    all.textContent = '전체 반';
    all.onclick = function () { groupId = ''; dueDate = ''; load(); };
    row.appendChild(all);

    (data.groups || []).forEach(function (g) {
      var b = document.createElement('button');
      b.className = 'asg-chip' + (g.group_id === groupId ? ' on' : '');
      b.textContent = g.group_name;
      b.onclick = function () { groupId = g.group_id; dueDate = ''; load(); };
      row.appendChild(b);
    });
    box.appendChild(row);

    if ((data.dueDates || []).length) {
      var sel = document.createElement('select');
      sel.className = 'asg-input';
      sel.style.marginTop = '10px';
      var o0 = document.createElement('option');
      o0.value = ''; o0.textContent = '전체 마감일';
      sel.appendChild(o0);
      data.dueDates.forEach(function (d) {
        var o = document.createElement('option');
        o.value = d; o.textContent = d + ' 마감';
        if (d === dueDate) o.selected = true;
        sel.appendChild(o);

      sel.onchange = function () { dueDate = sel.value; load(); };
      box.appendChild(sel);

  function renderCounts() {
    var box = $('rv-counts');
    box.innerHTML = '';
    var total = 0;
    BUCKETS.forEach(function (b) { total += (data.counts[b] || 0); });

    var all = document.createElement('button');
    all.className = 'rv-chip' + (bucket ? '' : ' on');
    all.innerHTML = '전체 <b>' + total + '</b>';
    all.onclick = function () { bucket = ''; renderCounts(); renderList(); };
    box.appendChild(all);

      var n = data.counts[b] || 0;
      if (!n) return;
      var btn = document.createElement('button');
      btn.className = 'rv-chip b-' + b + (b === bucket ? ' on' : '');

  function visibleRows() {

  }

  function card(r) {
    var c = document.createElement('div');

    if (r.attempts > 1) bits.push('총 ' + r.attempts + '회 제출');

    if (r.comment) {

      cm.className = 'rv-meta';
      cm.textContent = r.comment;

    var acts = document.createElement('div');
    acts.className = 'rv-actions';
    if (r.has_audio) {

  }

  function badge(r) {
    var b = document.createElement('span');

  /** 검사 패널 — 녹음 재생 + 회차 이력 + 피드백/반려 */
  function panel(r) {
    var p = document.createElement('div');

    var loading = document.createElement('div');
    loading.className = 'rv-meta';
    loading.textContent = '제출물 불러오는 중...';

    // 사진(QnA 손글씨·파닉스 쓰기)이면 이미지로 보여준다.
    Server.call('getSubmissionAudio', [token, r.submission_id], function (res) {
